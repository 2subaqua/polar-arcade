/* ---- Basics ------------------------------------------------------------ */
const W = 480, H = 270, STEP = 1 / 60, TAU = Math.PI * 2;
const FONT = 'ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ";

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mod = (a, n) => ((a % n) + n) % n;
const pad5 = n => String(n).padStart(5, "0");
const hits = (p, r) => p.x >= r.x && p.y >= r.y && p.x < r.x + r.w && p.y < r.y + r.h;
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function hsv(h, s, v) {
  h = mod(h, 1) * 6;
  const i = Math.floor(h), f = h - i, p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
  return [[v, t, p], [q, v, p], [p, v, t], [p, q, v], [t, p, v], [v, p, q]][i % 6];
}

/* ---- Sound ------------------------------------------------------------- */
const Sound = {
  ac: null, master: null, buf: {}, live: {},
  // Original volume_db from the Godot scenes, as gain.
  vol: { hop: -6, cheer: -2, mb_shoot: 4, mb_crash: -6, mb_push: -4, mb_lock: -3, mb_bark: -6, tb_win: -2, tb_lose: -2, tb_highscore: -1, tb_combo: -2, tb_gold: -2, tb_aurora: -4 },
  init(data) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ac = new AC();
    this.master = this.ac.createGain();
    this.master.gain.value = Save.d.mute ? 0 : 0.8;
    this.master.connect(this.ac.destination);
    for (const k in data) {
      const bin = atob(data[k]), u = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      this.ac.decodeAudioData(u.buffer, b => { this.buf[k] = this.trim(b); }, () => {});
    }
    setTimeout(() => { try { this.synth(); } catch (e) { console.error(e); } }, 60);
  },
  // A synthetic voice shouting "Yaayy!": a buzzing source shaped by three moving formants.
  yaay() {
    const sr = this.ac.sampleRate, n = Math.floor(0.85 * sr), b = this.ac.createBuffer(1, n, sr), c = b.getChannelData(0);
    const keys = [[0, 280, 2300, 3000], [0.14, 720, 1850, 2650], [0.62, 640, 1950, 2650], [1, 380, 2350, 2950]];
    const widths = [90, 130, 190], gains = [1, 0.65, 0.3], y1 = [0, 0, 0], y2 = [0, 0, 0];
    let ph = 0, peak = 0;
    for (let i = 0; i < n; i++) {
      const k = i / n, t = i / sr;
      const f0 = 230 + 190 * Math.min(1, k / 0.22) - 95 * Math.max(0, k - 0.4) / 0.6 + Math.sin(t * 34) * 7 * k;
      ph = (ph + f0 / sr) % 1;
      const src = ph * 2 - 1;
      let at = 0;
      while (at < keys.length - 2 && k > keys[at + 1][0]) at++;
      const a = keys[at], z = keys[at + 1], m = (k - a[0]) / (z[0] - a[0]);
      let out = 0;
      for (let f = 0; f < 3; f++) {
        const fr = a[f + 1] + (z[f + 1] - a[f + 1]) * m, r = Math.exp(-Math.PI * widths[f] / sr);
        const y = (1 - r) * src + 2 * r * Math.cos(TAU * fr / sr) * y1[f] - r * r * y2[f];
        y2[f] = y1[f]; y1[f] = y;
        out += y * gains[f];
      }
      c[i] = out * Math.min(1, k * 22) * Math.min(1, (1 - k) * 5);
      peak = Math.max(peak, Math.abs(c[i]));
    }
    // Radio treatment: overdrive, a narrow speaker band, crushed samples and a little static.
    const lowCut = 1 - Math.exp(-TAU * 450 / sr), highCut = 1 - Math.exp(-TAU * 2800 / sr);
    const holdFor = sr / 7500, steps = 14;
    let low = 0, high = 0, held = 0, nextHold = 0, top = 0;
    for (let i = 0; i < n; i++) {
      const x = Math.tanh(c[i] / peak * 3.5);
      low += (x - low) * lowCut; high += (x - high) * highCut;
      if (i >= nextHold) { held = Math.round((high - low) * steps) / steps; nextHold += holdFor; }
      const k = i / n;
      c[i] = held + (Math.random() - 0.5) * 0.14 * Math.min(1, k * 22) * Math.min(1, (1 - k) * 5);
      top = Math.max(top, Math.abs(c[i]));
    }
    for (let i = 0; i < n; i++) c[i] *= 0.85 / top;
    this.buf.yaay = b;
  },
  // The chip sounds come from a small model of an 80s sound chip:
  // raw square waves, a noise generator, 16 volume steps, new settings 50 times a second.
  // Nothing is smoothed, which is what makes it crisp.
  chip(name, frames, fn) {
    const sr = this.ac.sampleRate, per = Math.floor(sr / 50), n = frames * per;
    const b = this.ac.createBuffer(1, n, sr), c = b.getChannelData(0);
    const level = v => v <= 0 ? 0 : Math.pow(2, (Math.min(v, 15) - 15) / 2);
    const ph = [0, 0, 0];
    let np = 0, nv = 1, f = null;
    for (let i = 0; i < n; i++) {
      if (i % per === 0) f = fn(i / per, frames);
      let out = 0;
      (f.t || []).forEach(([hz, v], k) => { ph[k] = (ph[k] + hz / sr) % 1; out += (ph[k] < 0.5 ? 1 : -1) * level(v); });
      if (f.n) { np += f.n[0] / sr; if (np >= 1) { np %= 1; nv = Math.random() < 0.5 ? 1 : -1; } out += nv * level(f.n[1]); }
      c[i] = out * 0.3;
    }
    this.buf["mb_" + name] = b;
  },
  // Enemy explosions from the explosion lab: 1 chip pop, 4 arcade crackle, 5 ba-boom.
  explosions() {
    const sr = this.ac.sampleRate, make = (name, dur, fn) => {
      const n = Math.floor(dur * sr), b = this.ac.createBuffer(1, n, sr), c = b.getChannelData(0);
      let ph = 0, np = 0, nv = 1, peak = 0;
      const s = {
        noise: rate => { np += rate / sr; if (np >= 1) { np %= 1; nv = Math.random() < 0.5 ? 1 : -1; } return nv; },
        sq: f => { ph = (ph + f / sr) % 1; return ph < 0.5 ? 1 : -1; },
      };
      for (let i = 0; i < n; i++) { c[i] = Math.tanh(fn(i / sr, s)); peak = Math.max(peak, Math.abs(c[i])); }
      for (let i = 0; i < n; i++) c[i] *= 0.8 / peak * Math.min(1, (n - i) / (sr * 0.01));
      this.buf[name] = b;
    };
    make("boomChip", 0.5, (t, s) => {
      const hit = (t0, a) => { const u = t - t0; if (u < 0) return 0; return s.noise(16000 * Math.exp(-u * 5) + 2500) * a * Math.exp(-u * 9) + s.sq(900 * Math.exp(-u * 7) + 180) * 0.25 * a * Math.exp(-u * 14); };
      return hit(0, 0.8) + hit(0.09, 1);
    });
    make("boomArcade", 0.42, (t, s) => {
      const step = Math.min(7, Math.floor(t / 0.05));
      return s.noise(14000 - step * 1600) * Math.pow(2, -step);
    });
    make("boomBaboom", 0.6, (t, s) => {
      let v = 0;
      if (t < 0.07) v += s.noise(18000) * 0.75 * (1 - t / 0.07);
      const u = t - 0.1;
      if (u > 0) v += s.noise(7000 * Math.exp(-u * 3) + 2200) * Math.exp(-u * 6.5) + s.sq(320 * Math.exp(-u * 4) + 110) * 0.22 * Math.exp(-u * 8);
      return v;
    });
  },
  // A cheering crowd: a swelling roar of voices, "woo"s and lots of clapping.
  cheer() {
    const sr = this.ac.sampleRate, n = Math.floor(sr * 4.2), b = this.ac.createBuffer(1, n, sr), c = b.getChannelData(0);
    const voices = Array.from({ length: 26 }, () => ({ f: rnd(180, 420), ph: 0, start: rnd(0, 1.2), len: rnd(0.8, 2.4), rise: rnd(1.2, 1.8), vib: rnd(4, 7) }));
    const bands = [[700, 0.92], [1250, 0.93], [2500, 0.95]].map(([f, r]) => ({ a1: 2 * r * Math.cos(TAU * f / sr), a2: -r * r, y1: 0, y2: 0 }));
    const claps = new Float32Array(n);
    for (let k = 0; k < 160; k++) {
      const at = Math.floor(rnd(0.2, 3.9) * sr), a = rnd(0.3, 1), len = Math.floor(0.012 * sr);
      for (let j = 0; j < len && at + j < n; j++) claps[at + j] += (Math.random() * 2 - 1) * a * Math.exp(-j / sr * 420) * 0.9;
    }
    let peak = 0;
    for (let i = 0; i < n; i++) {
      const t = i / sr, env = Math.min(1, t / 0.5) * Math.min(1, (4.2 - t) / 1.2);
      let v = 0;
      for (const vo of voices) {
        const u = t - vo.start; if (u < 0 || u > vo.len) continue;
        const k = u / vo.len, f = vo.f * (1 + (vo.rise - 1) * Math.min(1, k * 3)) * (1 + Math.sin(u * vo.vib * TAU) * 0.02);
        vo.ph = (vo.ph + f / sr) % 1;
        v += (vo.ph * 2 - 1) * Math.sin(Math.PI * k) * 0.12;
      }
      let crowd = 0;
      const x = Math.random() * 2 - 1;
      for (const bd of bands) { const y = (1 - 0.93) * x + bd.a1 * bd.y1 + bd.a2 * bd.y2; bd.y2 = bd.y1; bd.y1 = y; crowd += y; }
      v = v * 0.5 + crowd * 1.6;
      v += claps[i];
      c[i] = Math.tanh(v * env * 1.4); peak = Math.max(peak, Math.abs(c[i]));
    }
    for (let i = 0; i < n; i++) c[i] *= 0.85 / peak;
    this.buf.cheer = b;
  },
  synth() {
    const C = (n, fr, fn) => this.chip(n, fr, fn);
    this.tbSounds();
    const notes = list => (i, n) => { const k = Math.floor(i / n * list.length), l = i / n * list.length - k; return { t: [[list[k], 14 - l * 7], [list[k] * 2, 10 - l * 6]] }; };
    // Chip sounds land in Sound.buf as "mb_" + name (play them with Sound.play("mb_shoot") and so on).
    // The menu's hop is a recording, in the assets at the bottom of the file. Winning, losing and a new
    // high score have Polar Arcade's own jingles (tbSounds, below): tb_win, tb_lose, tb_highscore.
    // The placeholder game's sounds:
    C("shoot", 10, i => ({ t: [[5200 - i * 430, 12 - i], [2600 - i * 210, 15 - i * 0.6]], n: [18000, 11 - i * 1.6] }));
    C("pickup", 16, notes([988, 1319, 1568, 1976]));
    C("crash", 30, i => {
      const fade = 15 - i * 0.5, shard = () => 2500 + Math.random() * 6000;
      return { t: [[shard(), fade], [shard(), fade - 1], [shard(), fade - 2 - (i % 2) * 6]], n: [10000, 15 - i * 1.5] };
    });
    // Igloo Builder
    C("push", 8, i => ({ n: [9000 - i * 700, 11 - i * 1.2], t: [[180 + i * 30, 8 - i]] }));                    // a block sets off across the ice
    C("bump", 4, i => ({ t: [[140 - i * 20, 13 - i * 3]], n: [2500, 10 - i * 3] }));                           // and stops with a knock

/* ---- Screen ------------------------------------------------------------ */
/* Two layouts, shared by every game. All games draw in the same 480x270 world with the
   playing field at x 120-360 and their panels on either side:
   - landscape: the whole world fits the screen, touch controls sit in the side panels
   - portrait:  the field fills the width, a HUD strip (y -34 to 0) sits above it and
                the touch controls below it (y 272 and down); the side panels are off screen */
const HUD_H = 34, TOP_GAP = 18;
const View = {
  s: 1, ox: 0, oy: 0, dpr: 1, vw: 0, vh: 0, safeB: 0, portrait: false,
  resize() {
    const vw = this.vw = innerWidth, vh = this.vh = innerHeight;
    this.dpr = Math.min(devicePixelRatio || 1, 2.5);
    cv.width = Math.round(vw * this.dpr); cv.height = Math.round(vh * this.dpr);
    const r = document.getElementById("safe").getBoundingClientRect(), safeT = r.top;
    this.safeB = Math.max(vh - r.bottom, 0); this.safeKey = r.top + "," + r.bottom;
    this.portrait = vh > vw;
    if (this.portrait) {
      // TOP_GAP: an empty row above the score line, clear of the phone's status bar.
      this.s = Math.min(vw / 240, (vh - safeT - this.safeB) / (404 + TOP_GAP));
      this.ox = (vw - 240 * this.s) / 2 - 120 * this.s;
      this.oy = safeT + (HUD_H + TOP_GAP) * this.s;
    } else {
      this.s = Math.min(vw / W, vh / H);
      this.ox = (vw - W * this.s) / 2; this.oy = (vh - H * this.s) / 2;
    }
  },
  apply() {
    const k = this.s * this.dpr;

    ctx.imageSmoothingEnabled = false;
  },
  toGame: (x, y) => ({ x: (x - View.ox) / View.s, y: (y - View.oy) / View.s }),
  get left() { return -this.ox / this.s; },
  get right() { return (this.vw - this.ox) / this.s; },
  get top() { return -this.oy / this.s; },
  get bottom() { return (this.vh - this.oy) / this.s; },
  get usableBottom() { return (this.vh - this.safeB - this.oy) / this.s; },
  fill(c) { rect(this.left, this.top, this.right - this.left, this.bottom - this.top, c); },

addEventListener("resize", () => View.resize());
// Phones (above all a home-screen app) can report the status-bar inset a moment after start, without any resize
// event, which left the menu too high until the app was reopened. So also listen for these, and check the inset now and then.
if (window.visualViewport) visualViewport.addEventListener("resize", () => View.resize());
addEventListener("orientationchange", () => setTimeout(() => View.resize(), 300));
addEventListener("pageshow", () => View.resize());
document.addEventListener("visibilitychange", () => { if (!document.hidden) View.resize(); });

function text(s, x, y, o = {}) {

  ctx.fillStyle = c; ctx.fill();

  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));

const Img = {};
function sprite(img, sx, sy, w, h, x, y, flip) {

  if (flip) { ctx.save(); ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(img, sx, sy, w, h, 0, 0, w, h); ctx.restore(); }
  else ctx.drawImage(img, sx, sy, w, h, x, y, w, h);

function turned16(img, sx, sy, x, y) {
  ctx.save(); ctx.translate(Math.round(x), Math.round(y)); ctx.rotate(-Math.PI / 2);
  ctx.drawImage(img, sx, sy, 16, 16, -8, -8, 16, 16); ctx.restore();

function tint(img, color) {           // Godot's modulate
  const key = img.src + color;
  if (!tints.has(key)) {
    const c = document.createElement("canvas"); c.width = img.width; c.height = img.height;
    const g = c.getContext("2d");
    g.drawImage(img, 0, 0); g.globalCompositeOperation = "multiply"; g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
    g.globalCompositeOperation = "destination-in"; g.drawImage(img, 0, 0);

  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 1, 0, TAU); ctx.fill(); ctx.restore();

const ACTIONS = ["left", "right", "up", "down", "a", "b", "x", "y", "pause"];

      const std = p.mapping === "standard", hx = std ? 0 : ax[6] || 0, hy = std ? 0 : ax[7] || 0;

    }

  },
  update() {
    const pad = this.readPad();
    if (Object.keys(pad).length) {

      this.touchMode = false;            // playing with a controller: hide the touch pads until the screen is touched again
    }

      const now = !!(this.kb[a] || this.latch[a] || pad[a] || this.touch[a]);

addEventListener("keydown", e => {
  Sound.wake();

  // While entering a name, letter keys are letters and nothing else.
  if (scene.state === "name" && !paused && /^(Key|Digit)/.test(e.code)) { if (!e.repeat) Input.typed.push(e.key.toUpperCase()); e.preventDefault(); return; }

  // Three digits start it at once; otherwise it starts a moment after the last digit.
  if (e.code === "KeyP") { Input.testAt = performance.now(); Input.testNum = ""; e.preventDefault(); return; }

    Input.testNum += dig[1]; Input.testAt = performance.now(); e.preventDefault();

  e.preventDefault(); Sound.wake(); if (e.pointerType !== "touch") cv.focus({ preventScroll: true });
  if (e.pointerType === "touch") Input.touchMode = true;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}

for (const t of ["contextmenu", "selectstart", "dblclick", "gesturestart", "dragstart"]) document.addEventListener(t, noDefault, { passive: false });
document.addEventListener("selectionchange", () => { const g = getSelection(); if (g && g.rangeCount) g.removeAllRanges(); });

// One save slot, for when a game gets interrupted. Loading it empties the slot.
function saveGame() {
  const g = scene;
  Save.d.save = { id: g.id, title: g.title, level: g.level, score: g.score, lives: g.lives, data: g.saveData() };
  Save.write();
}
function loadGame() {
  const d = Save.d.save, g = CARDS.find(c => c.id === d.id).make();
  g.level = d.level; g.score = d.score; g.lives = d.lives; g.jobs = []; g.msg = null;
  g.build(); g.loadData(d.data); g.ready();
  Save.d.save = null; Save.write();
  menu.sel = 0;
  go(g);
}

function testLevel(n) {
  const card = scene === menu ? CARDS[menu.sel] : CARDS.find(c => c.id === scene.id);
  if (!LEVELS[card.id][n]) return;
  const g = card.make();
  g.level = n; g.jobs = []; g.msg = null; g.build(); g.ready();
  go(g);
}

function toggleFull() {
  try {
    const d = document;
    if (d.fullscreenElement) d.exitFullscreen();
    else { const p = d.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); }
  } catch (e) {}
}

/* ---- A small SID player: a 6502 that runs the tune's own code, and the SID chip it talks to. ---- */
const SIDPlayer = (() => {
  // Official 6502 opcodes: "mnemonic mode" per opcode byte.
  const OPS = {};
  ("ADC 69 imm 65 zp 75 zpx 6D abs 7D abx 79 aby 61 izx 71 izy|AND 29 imm 25 zp 35 zpx 2D abs 3D abx 39 aby 21 izx 31 izy|" +
   "ASL 0A acc 06 zp 16 zpx 0E abs 1E abx|BCC 90 rel|BCS B0 rel|BEQ F0 rel|BIT 24 zp 2C abs|BMI 30 rel|BNE D0 rel|BPL 10 rel|BRK 00 imp|" +
   "BVC 50 rel|BVS 70 rel|CLC 18 imp|CLD D8 imp|CLI 58 imp|CLV B8 imp|CMP C9 imm C5 zp D5 zpx CD abs DD abx D9 aby C1 izx D1 izy|" +
   "CPX E0 imm E4 zp EC abs|CPY C0 imm C4 zp CC abs|DEC C6 zp D6 zpx CE abs DE abx|DEX CA imp|DEY 88 imp|" +
   "EOR 49 imm 45 zp 55 zpx 4D abs 5D abx 59 aby 41 izx 51 izy|INC E6 zp F6 zpx EE abs FE abx|INX E8 imp|INY C8 imp|" +
   "JMP 4C abs 6C ind|JSR 20 abs|LDA A9 imm A5 zp B5 zpx AD abs BD abx B9 aby A1 izx B1 izy|LDX A2 imm A6 zp B6 zpy AE abs BE aby|" +
   "LDY A0 imm A4 zp B4 zpx AC abs BC abx|LSR 4A acc 46 zp 56 zpx 4E abs 5E abx|NOP EA imp|" +
   "ORA 09 imm 05 zp 15 zpx 0D abs 1D abx 19 aby 01 izx 11 izy|PHA 48 imp|PHP 08 imp|PLA 68 imp|PLP 28 imp|" +
   "ROL 2A acc 26 zp 36 zpx 2E abs 3E abx|ROR 6A acc 66 zp 76 zpx 6E abs 7E abx|RTI 40 imp|RTS 60 imp|" +
   "SBC E9 imm E5 zp F5 zpx ED abs FD abx F9 aby E1 izx F1 izy|SEC 38 imp|SED F8 imp|SEI 78 imp|" +
   "STA 85 zp 95 zpx 8D abs 9D abx 99 aby 81 izx 91 izy|STX 86 zp 96 zpy 8E abs|STY 84 zp 94 zpx 8C abs|" +
   "TAX AA imp|TAY A8 imp|TSX BA imp|TXA 8A imp|TXS 9A imp|TYA 98 imp").split("|").forEach(g => {
    const p = g.split(" ");
    for (let i = 1; i < p.length; i += 2) OPS[parseInt(p[i], 16)] = [p[0], p[i + 1]];
  });

  class CPU {
    constructor(mem, sid) { this.m = mem; this.sid = sid; this.a = this.x = this.y = 0; this.s = 0xff; this.p = 0x24; this.pc = 0; }
    rd(a) { a &= 0xffff; return a >= 0xd400 && a <= 0xd7ff ? this.sid.read(a & 0x1f) : this.m[a]; }
    wr(a, v) { a &= 0xffff; v &= 0xff; if (a >= 0xd400 && a <= 0xd7ff) this.sid.write(a & 0x1f, v); this.m[a] = v; }
    push(v) { this.m[0x100 + this.s] = v & 0xff; this.s = (this.s - 1) & 0xff; }
    pull() { this.s = (this.s + 1) & 0xff; return this.m[0x100 + this.s]; }
    nz(v) { v &= 0xff; this.p = (this.p & 0x7d) | (v & 0x80) | (v ? 0 : 2); return v; }
    // Call a routine and run it until it returns (or gives up after a while).
    call(addr, a = 0) {
      this.a = a; this.x = this.y = 0; this.s = 0xff; this.p = 0x24;
      this.push(0xff); this.push(0xfe);                  // return to $FFFF: that is where we stop
      this.pc = addr;
      for (let n = 0; n < 200000 && this.pc !== 0xffff; n++) if (!this.step()) break;
    }
    step() {
      const op = this.m[this.pc], d = OPS[op];
      if (!d) { this.pc = 0xffff; return false; }       // an unknown opcode: stop this call
      const [mn, mode] = d, pc1 = (this.pc + 1) & 0xffff;
      let addr = 0, len = 1;
      const w = a => this.m[a & 0xffff] | (this.m[(a + 1) & 0xffff] << 8);
      switch (mode) {
        case "imm": addr = pc1; len = 2; break;
        case "zp": addr = this.m[pc1]; len = 2; break;
        case "zpx": addr = (this.m[pc1] + this.x) & 0xff; len = 2; break;
        case "zpy": addr = (this.m[pc1] + this.y) & 0xff; len = 2; break;
        case "abs": addr = w(pc1); len = 3; break;
        case "abx": addr = (w(pc1) + this.x) & 0xffff; len = 3; break;
        case "aby": addr = (w(pc1) + this.y) & 0xffff; len = 3; break;
        case "ind": { const p = w(pc1); addr = this.m[p] | (this.m[(p & 0xff00) | ((p + 1) & 0xff)] << 8); len = 3; break; }
        case "izx": { const z = (this.m[pc1] + this.x) & 0xff; addr = this.m[z] | (this.m[(z + 1) & 0xff] << 8); len = 2; break; }
        case "izy": { const z = this.m[pc1]; addr = ((this.m[z] | (this.m[(z + 1) & 0xff] << 8)) + this.y) & 0xffff; len = 2; break; }
        case "rel": addr = pc1; len = 2; break;
      }
      let next = (this.pc + len) & 0xffff;
      const C = this.p & 1, branch = cond => { if (cond) { const o = this.m[addr]; next = (next + (o < 128 ? o : o - 256)) & 0xffff; } };
      const cmp = (r, v) => { const t = r - v; this.p = (this.p & 0xfe) | (t >= 0 ? 1 : 0); this.nz(t); };
      const adc = v => {
        if (this.p & 8) {                                // decimal mode
          let lo = (this.a & 15) + (v & 15) + C, hi = (this.a >> 4) + (v >> 4);
          if (lo > 9) { lo += 6; hi++; }
          const ov = ~(this.a ^ v) & (this.a ^ (hi << 4)) & 0x80;
          if (hi > 9) hi += 6;
          this.p = (this.p & 0xbe) | (hi > 15 ? 1 : 0) | (ov ? 0x40 : 0);
          this.a = this.nz(((hi << 4) | (lo & 15)) & 0xff);
        } else {
          const t = this.a + v + C;
          this.p = (this.p & 0xbe) | (t > 255 ? 1 : 0) | ((~(this.a ^ v) & (this.a ^ t) & 0x80) ? 0x40 : 0);
          this.a = this.nz(t);
        }
      };
      const sbc = v => {
        if (this.p & 8) {
          let lo = (this.a & 15) - (v & 15) - (1 - C), hi = (this.a >> 4) - (v >> 4);
          if (lo < 0) { lo -= 6; hi--; }
          if (hi < 0) hi -= 6;
          const t = this.a - v - (1 - C);
          this.p = (this.p & 0xbe) | (t >= 0 ? 1 : 0) | (((this.a ^ v) & (this.a ^ t) & 0x80) ? 0x40 : 0);
          this.a = this.nz(((hi << 4) | (lo & 15)) & 0xff);
        } else {
          const t = this.a - v - (1 - C);
          this.p = (this.p & 0xbe) | (t >= 0 ? 1 : 0) | (((this.a ^ v) & (this.a ^ t) & 0x80) ? 0x40 : 0);
          this.a = this.nz(t);
        }
      };
      const rmw = f => { if (mode === "acc") this.a = f(this.a); else this.wr(addr, f(this.rd(addr))); };
      switch (mn) {
        case "LDA": this.a = this.nz(this.rd(addr)); break;
        case "LDX": this.x = this.nz(this.rd(addr)); break;
        case "LDY": this.y = this.nz(this.rd(addr)); break;
        case "STA": this.wr(addr, this.a); break;
        case "STX": this.wr(addr, this.x); break;
        case "STY": this.wr(addr, this.y); break;
        case "ADC": adc(this.rd(addr)); break;
        case "SBC": sbc(this.rd(addr)); break;
        case "AND": this.a = this.nz(this.a & this.rd(addr)); break;
        case "ORA": this.a = this.nz(this.a | this.rd(addr)); break;
        case "EOR": this.a = this.nz(this.a ^ this.rd(addr)); break;
        case "CMP": cmp(this.a, this.rd(addr)); break;
        case "CPX": cmp(this.x, this.rd(addr)); break;
        case "CPY": cmp(this.y, this.rd(addr)); break;
        case "BIT": { const v = this.rd(addr); this.p = (this.p & 0x3d) | (v & 0xc0) | ((this.a & v) ? 0 : 2); break; }
        case "ASL": rmw(v => { this.p = (this.p & 0xfe) | (v >> 7); return this.nz(v << 1); }); break;
        case "LSR": rmw(v => { this.p = (this.p & 0xfe) | (v & 1); return this.nz(v >> 1); }); break;
        case "ROL": rmw(v => { const c = this.p & 1; this.p = (this.p & 0xfe) | (v >> 7); return this.nz((v << 1) | c); }); break;
        case "ROR": rmw(v => { const c = this.p & 1; this.p = (this.p & 0xfe) | (v & 1); return this.nz((v >> 1) | (c << 7)); }); break;
        case "INC": this.wr(addr, this.nz(this.rd(addr) + 1)); break;
        case "DEC": this.wr(addr, this.nz(this.rd(addr) - 1)); break;
        case "INX": this.x = this.nz(this.x + 1); break;
        case "INY": this.y = this.nz(this.y + 1); break;
        case "DEX": this.x = this.nz(this.x - 1); break;
        case "DEY": this.y = this.nz(this.y - 1); break;
        case "TAX": this.x = this.nz(this.a); break;
        case "TAY": this.y = this.nz(this.a); break;
        case "TXA": this.a = this.nz(this.x); break;
        case "TYA": this.a = this.nz(this.y); break;
        case "TSX": this.x = this.nz(this.s); break;
        case "TXS": this.s = this.x; break;
        case "PHA": this.push(this.a); break;
        case "PHP": this.push(this.p | 0x30); break;
        case "PLA": this.a = this.nz(this.pull()); break;
        case "PLP": this.p = (this.pull() & 0xef) | 0x20; break;
        case "CLC": this.p &= 0xfe; break;
        case "SEC": this.p |= 1; break;
        case "CLI": this.p &= 0xfb; break;
        case "SEI": this.p |= 4; break;
        case "CLV": this.p &= 0xbf; break;
        case "CLD": this.p &= 0xf7; break;
        case "SED": this.p |= 8; break;
        case "BCC": branch(!(this.p & 1)); break;
        case "BCS": branch(this.p & 1); break;
        case "BNE": branch(!(this.p & 2)); break;
        case "BEQ": branch(this.p & 2); break;
        case "BPL": branch(!(this.p & 0x80)); break;
        case "BMI": branch(this.p & 0x80); break;
        case "BVC": branch(!(this.p & 0x40)); break;
        case "BVS": branch(this.p & 0x40); break;
        case "JMP": next = addr; break;
        case "JSR": { const r = (this.pc + 2) & 0xffff; this.push(r >> 8); this.push(r); next = addr; break; }
        case "RTS": next = ((this.pull() | (this.pull() << 8)) + 1) & 0xffff; break;
        case "RTI": this.p = (this.pull() & 0xef) | 0x20; next = this.pull() | (this.pull() << 8); break;
        case "BRK": next = 0xffff; break;
        case "NOP": break;
      }
      this.pc = next;
      return true;
    }
  }

  // The SID chip: three voices (oscillator, waveform, envelope), a filter and a volume.
  const ATTACK = [9, 32, 63, 95, 149, 220, 267, 313, 392, 977, 1954, 3126, 3907, 11720, 19532, 31251];
  class SID {
    constructor(rate, model) {
      this.rate = rate; this.clock = 985248; this.cps = this.clock / rate; this.model = model;
      this.r = new Uint8Array(32);
      this.v = [0, 1, 2].map(() => ({ acc: 0, lfsr: 0x7ffff8, env: 0, state: "release", rc: 0, ec: 0, gate: 0, prevMsb: 0, out: 0 }));
      this.lp = 0; this.bp = 0; this.dcx = 0; this.dcy = 0;
    }
    write(reg, val) {
      this.r[reg] = val;
      if (reg < 21 && reg % 7 === 4) {                   // control register: gate on starts the attack, gate off the release
        const v = this.v[(reg / 7) | 0], g = val & 1;
        if (g && !v.gate) { v.state = "attack"; }
        else if (!g && v.gate) v.state = "release";
        v.gate = g;
        if (val & 8) { v.acc = 0; v.lfsr = 0x7ffff8; }
      }
    }
    read(reg) {
      if (reg === 0x1b) return this.v[2].out >> 4;       // oscillator 3
      if (reg === 0x1c) return this.v[2].env;            // envelope 3
      if (reg === 0x19 || reg === 0x1a) return 0xff;      // paddles: nothing plugged in
      // The other registers can only be written; reading one gives back what is still on the bus, which is
      // close enough to the value last written there. Some players rely on it (they set the gate bit with
      // LDA $D404 / ORA #1 / STA $D404, as in Fred Gray's "Fox Fights Back").
      return this.r[reg] || 0;
    }
    envStep(v, i, cycles) {
      const base = i * 7, ad = this.r[base + 5], sr = this.r[base + 6];
      const rate = v.state === "attack" ? ATTACK[ad >> 4] : v.state === "decay" ? ATTACK[ad & 15] * 3 : v.state === "release" ? ATTACK[sr & 15] * 3 : 0;
      if (!rate) return;
      v.rc += cycles;
      while (v.rc >= rate) {
        v.rc -= rate;
        if (v.state === "attack") { if (++v.env >= 255) { v.env = 255; v.state = "decay"; } continue; }
        // decay and release are exponential: the steps slow down as the level falls
        const e = v.env, div = e > 93 ? 1 : e > 54 ? 2 : e > 26 ? 4 : e > 14 ? 8 : e > 6 ? 16 : 30;
        if (++v.ec < div) continue;
        v.ec = 0;
        const sustain = (sr >> 4) * 17;
        if (v.state === "decay") { if (v.env > sustain) v.env--; else { v.state = "sustain"; break; } }
        else if (v.env > 0) v.env--;

    }
    sample() {
      const r = this.r, cps = this.cps;
      let filt = 0, direct = 0;
      for (let i = 0; i < 3; i++) {
        const v = this.v[i], b = i * 7, ctrl = r[b + 4], freq = r[b] | (r[b + 1] << 8), pw = (r[b + 2] | ((r[b + 3] & 15) << 8));
        const src = this.v[(i + 2) % 3];
        this.envStep(v, i, cps);
        if (!(ctrl & 8)) {
          const old = v.acc;
          v.acc = (v.acc + freq * cps) % 0x1000000;
          if ((old & 0x80000) === 0 && (v.acc & 0x80000) || v.acc < old) {   // noise: shift on bit 19 rising (approximately)
            const steps = Math.max(1, Math.floor(freq * cps / 0x100000));
            for (let k = 0; k < Math.min(steps, 8); k++) { const bit = ((v.lfsr >> 22) ^ (v.lfsr >> 17)) & 1; v.lfsr = ((v.lfsr << 1) | bit) & 0x7fffff; }
          }
        }
        v.wrapped = v.acc < (v._last || 0); v._last = v.acc;
        const acc = v.acc | 0;
        let out = 0xfff, any = false;
        if (ctrl & 0x10) {                                // triangle (ring modulation flips it with the other voice)
          const msb = (ctrl & 4) ? ((acc ^ src.acc) & 0x800000) : (acc & 0x800000);
          out &= ((msb ? ~acc : acc) >> 11) & 0xfff; any = true;
        }
        if (ctrl & 0x20) { out &= acc >> 12; any = true; }
        if (ctrl & 0x40) { out &= ((acc >> 12) >= pw) ? 0xfff : 0; any = true; }
        if (ctrl & 0x80) {
          const l = v.lfsr;
          out &= ((l >> 11) & 0x800) | ((l >> 10) & 0x400) | ((l >> 7) & 0x200) | ((l >> 5) & 0x100) | ((l >> 4) & 0x80) | ((l >> 1) & 0x40) | ((l << 1) & 0x20) | ((l << 2) & 0x10);
          any = true;
        }
        if (!any) out = 2048;                              // no waveform: silent
        v.out = out;
        const s = (out - 2048) * v.env / 255;
        if (i === 2 && (r[24] & 0x80) && !(r[23] & 4)) continue;   // voice 3 off
        if (r[23] & (1 << i)) filt += s; else direct += s;
      }
      // hard sync: a voice restarts when the voice before it wraps
      for (let i = 0; i < 3; i++) if ((r[i * 7 + 4] & 2) && this.v[(i + 2) % 3].wrapped) this.v[i].acc = 0;
      // the filter: a state-variable filter; the 6581's cutoff curve is steep and starts high
      const fc = (r[21] & 7) | (r[22] << 3), res = r[23] >> 4, mode = r[24];
      const hz = this.model === 8580 ? 30 + fc * 6 : 220 + 15000 * Math.pow(fc / 2047, 1.9);
      const f = Math.min(0.9, 2 * Math.sin(Math.PI * Math.min(hz, this.rate * 0.45) / this.rate)), q = 1.4 - res * 0.075;
      const hp = filt - this.lp - q * this.bp;
      this.bp += f * hp; this.lp += f * this.bp;
      let fo = 0;
      if (mode & 0x10) fo += this.lp;
      if (mode & 0x20) fo += this.bp;
      if (mode & 0x40) fo += hp;
      // the output goes through a capacitor on the C64 board: no DC, no rumble
      const x = (direct + fo) * (mode & 15) / 15 / 14000;
      const y = x - this.dcx + 0.996 * this.dcy; this.dcx = x; this.dcy = y;
      return y;
    }
  }

  // Load a PSID file and play one of its songs.
  function load(bytes) {
    const u16 = o => (bytes[o] << 8) | bytes[o + 1];
    const off = u16(6), songs = u16(14), start = u16(16), speed = (bytes[18] << 24) | (bytes[19] << 16) | (bytes[20] << 8) | bytes[21];
    let load = u16(8), data = bytes.subarray(off);
    if (!load) { load = data[0] | (data[1] << 8); data = data.subarray(2); }
    const flags = off >= 0x7c ? u16(0x76) : 0;
    return { load, data, init: u16(10), play: u16(12), songs, start, speed, model: ((flags >> 4) & 3) === 2 ? 8580 : 6581,
      name: String.fromCharCode(...bytes.subarray(22, 54)).replace(/\0.*$/, ""), author: String.fromCharCode(...bytes.subarray(54, 86)).replace(/\0.*$/, "") };
  }
  function player(bytes, song, rate, model) {
    const t = load(bytes), mem = new Uint8Array(65536), sid = new SID(rate, model || t.model), cpu = new CPU(mem, sid);
    mem.set(t.data, t.load);
    cpu.call(t.init, (song || t.start) - 1);
    const hz = (t.speed >> ((song || t.start) - 1)) & 1 ? 60 : 50;   // VBI = 50 times a second on a PAL machine
    let left = 0;
    return {
      tune: t, sid,
      // fill a buffer with the next samples
      render(out) {
        for (let i = 0; i < out.length; i++) {
          if (left <= 0) { cpu.call(t.play); left += rate / hz; }
          left--;
          out[i] = sid.sample();
        }
      },
    };
  }
  return { load, player };
})();

/* ---- On-screen touch controls, in the side panels ----------------------- */
const Pads = {
  zone(side) {
    if (View.portrait) {
      const a = side < 0 ? 120 : 240, b = a + 120, top = 272, h = View.usableBottom - top, r = Math.min(52, h / 2 - 3, 56);
      return { x: (a + b) / 2, y: top + h / 2, r, a, b, top };
    }
    const a = side < 0 ? View.left : 362, b = side < 0 ? 118 : View.right, r = Math.min(52, (b - a) / 2 - 4);
    return { x: (a + b) / 2, y: 270 - r - 8, r, a, b, top: 150 };
  },
  // A round stick under the left thumb and one button under the right. The stick reads eight ways
  // (a slant gives both a sideways and an up/down direction) and also gives the exact angle in t.dir.
  readStick() {
    const t = {}, l = this.zone(-1), r = this.zone(1);
    for (const p of Input.pointers.values()) {
      if (p.y < l.top) continue;
      if (p.x >= l.a && p.x <= l.b) {
        const dx = p.x - l.x, dy = p.y - l.y;
        if (Math.hypot(dx, dy) > 6) {
          const a = Math.atan2(dy, dx), c = Math.cos(a), s = Math.sin(a);
          t.dir = a;
          if (Math.abs(c) > 0.38) t[c < 0 ? "left" : "right"] = true;       // 0.38 = sin 22.5 degrees: eight equal slices
          if (Math.abs(s) > 0.38) t[s < 0 ? "up" : "down"] = true;
        }
      } else if (p.x >= r.a && p.x <= r.b) t.a = true;
    }
    return t;
  },
  // Igloo Builder: the stick, and Lock above Push under the right thumb.
  iglooButtons() {
    const r = this.zone(1), rr = Math.min(r.r * 0.46, 28);
    return { x: r.x, y: Math.min(r.y, View.usableBottom - rr * 2 - 8), rr };
  },
  readIgloo() {
    const t = this.readStick(), l = this.zone(-1), r = this.zone(1), b = this.iglooButtons();
    delete t.a;
    for (const p of Input.pointers.values()) if (p.y >= r.top && p.x >= r.a && p.x <= r.b) t[p.y < b.y ? "b" : "a"] = true;
    // the stick is read for its direction only: the inuit walks the way it points most
    if (t.dir !== undefined) {
      const c = Math.cos(t.dir), s = Math.sin(t.dir);
      delete t.left; delete t.right; delete t.up; delete t.down;
      if (Math.abs(c) > Math.abs(s)) t[c < 0 ? "left" : "right"] = true; else t[s < 0 ? "up" : "down"] = true;
    }
    return t;
  },
  drawIgloo() {
    this.drawStick(null);
    const { x, y, rr } = this.iglooButtons();
    for (const [k, a, label, col] of [[-1, "b", "Lock", "rgba(255,255,255,.5)"], [1, "a", "Push", "rgba(90,190,240,.6)"]]) {
      const cy = y + k * (rr + 3), on = Input.touch[a];
      ctx.beginPath(); ctx.arc(x, cy, rr, 0, TAU); ctx.fillStyle = on ? "#fff3b0" : col; ctx.fill();
      text(label, x, cy, { size: 12, color: on ? "#03121a" : "#0b3047" });
    }
  },
  drawStick(label = "Fire", color = "rgba(255,138,61,.55)") {
    const l = this.zone(-1), r = this.zone(1);
    ctx.beginPath(); ctx.arc(l.x, l.y, l.r * 0.85, 0, TAU); ctx.fillStyle = "rgba(90,200,230,.18)"; ctx.fill();
    ctx.strokeStyle = "rgba(120,220,240,.55)"; ctx.lineWidth = 3; ctx.stroke();
    for (let k = 0; k < 4; k++) {                    // faint marks for the four main directions
      const a = k * Math.PI / 2, rr = l.r * 0.85;
      line([[l.x + Math.cos(a) * rr * 0.72, l.y + Math.sin(a) * rr * 0.72], [l.x + Math.cos(a) * rr * 0.92, l.y + Math.sin(a) * rr * 0.92]], "rgba(200,245,255,.5)");
    }
    if (Input.touch.dir !== undefined) {
      ctx.beginPath(); ctx.arc(l.x + Math.cos(Input.touch.dir) * l.r * 0.6, l.y + Math.sin(Input.touch.dir) * l.r * 0.6, 9, 0, TAU);
      ctx.fillStyle = "rgba(150,240,255,.9)"; ctx.fill();
    }
    if (label === null) return;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r * 0.86, 0, TAU);
    ctx.fillStyle = Input.touch.a ? "#ffe0b0" : color; ctx.fill();
    text(label, r.x, r.y, { size: 14, color: Input.touch.a ? "#03121a" : "#fff" });
  },
};

/* ---- Icons in the panel corners ---------------------------------------- */
const canFull = () => { try { return !!document.fullscreenEnabled; } catch (e) { return false; } };
const UI = {
  get mute() { return View.portrait ? { x: 333, y: -31, w: 26, h: 26 } : { x: 452, y: 4, w: 26, h: 26 }; },
  get full() { return View.portrait ? { x: 305, y: -31, w: 26, h: 26 } : { x: 424, y: 4, w: 26, h: 26 }; },   // beside the sound icon
  get level() { return View.portrait ? { x: canFull() ? 277 : 305, y: -31, w: 26, h: 26 } : { x: canFull() ? 396 : 424, y: 4, w: 26, h: 26 }; },   // menu only: choose a level
  get pause() { return View.portrait ? { x: 121, y: -31, w: 26, h: 26 } : { x: 2, y: 4, w: 26, h: 26 }; },
  back(r) { rounded(r.x + 2, r.y + 2, r.w - 4, r.h - 4, 5); ctx.fillStyle = "rgba(255,255,255,.1)"; ctx.fill(); return [r.x + r.w / 2, r.y + r.h / 2]; },
  draw(paused) {
    let [x, y] = this.back(this.mute);
    poly([[x - 7, y - 3], [x - 3, y - 3], [x + 2, y - 7], [x + 2, y + 7], [x - 3, y + 3], [x - 7, y + 3]], "#cdeaf2");
    if (Save.d.mute) { line([[x + 4, y - 4], [x + 9, y + 4]], "#ff7a9c", 1.8); line([[x + 9, y - 4], [x + 4, y + 4]], "#ff7a9c", 1.8); }
    else { ctx.beginPath(); ctx.arc(x + 2, y, 6, -0.8, 0.8); ctx.strokeStyle = "#cdeaf2"; ctx.lineWidth = 1.6; ctx.stroke(); }
    if (canFull()) {
      [x, y] = this.back(this.full);
      for (const [a, b] of [[-1, -1], [1, -1], [1, 1], [-1, 1]])
        line([[x + a * 7, y + b * 3], [x + a * 7, y + b * 7], [x + a * 3, y + b * 7]], "#cdeaf2", 1.8);
    }
    if (scene === menu && !menu.choosing) {          // three steps: pick a level
      [x, y] = this.back(this.level);
      const c = menu.picking ? "#ffd94d" : "#cdeaf2";              // a square with four boxes in it
      for (const [dx, dy] of [[-7, -7], [1, -7], [-7, 1], [1, 1]]) rect(x + dx, y + dy, 6, 6, c);
    }
    if (scene !== menu && !paused) {
      [x, y] = this.back(this.pause);
      rect(x - 5, y - 6, 3.5, 12, "#cdeaf2"); rect(x + 1.5, y - 6, 3.5, 12, "#cdeaf2");
    }
  },
  // Returns true if the tap landed on a corner icon.
  tap(p) {
    if (hits(p, this.mute)) { Sound.toggle(); return true; }
    if (canFull() && hits(p, this.full)) { toggleFull(); return true; }
    if (scene === menu && !menu.choosing && hits(p, this.level)) { menu.togglePicker(); return true; }
    if (scene !== menu && !paused && hits(p, this.pause)) { paused = true; pauseSel = 0; pauseSaved = false; Sound.stopAll(); return true; }
    return false;
  },
};

/* ---- What every game shares: timers, HUD and the high-score table -------- */
class Game {
  constructor(id, title) {
    this.id = id; this.title = title; this.jobs = []; this.t = 0; this.score = 0; this.lives = 3;
    this.prefix = ""; this.level = 0; this.state = "ready"; this.msg = null; this.floats = []; this.dim = false; this.entry = null;
  }
  get levels() { return LEVELS[this.id]; }
  get hsId() { return this.id; }
  get cfg() { return Object.assign({}, DEFAULTS[this.id], this.levels[this.level]); }
  get lastLevel() { return this.level >= this.levels.length - 1; }
  get levelLabel() { return this.level + 1 + " / " + this.levels.length; }
  // What a saved game must remember, on top of level, score and lives.
  saveData() { return {}; }
  loadData() {}
  get canSave() { return this.state === "play" || this.state === "ready"; }
  snd(k, loop) { Sound.play(this.prefix + k, loop); }
  quiet(k) { Sound.stop(this.prefix + k); }
  after(d, done, owner) { this.jobs.push({ left: d, dur: d, done, owner }); }
  tween(d, step, done, owner) { this.jobs.push({ left: d, dur: d, step, done, owner }); }
  runJobs(dt) {
    const cur = this.jobs, keep = [];
    this.jobs = [];
    for (const j of cur) {
      if (j.owner && j.owner.dead) continue;
      j.left -= dt;
      if (j.step) j.step(Math.min(1, 1 - j.left / j.dur));
      if (j.left <= 0) { if (j.done) j.done(); } else keep.push(j);
    }
    this.jobs = keep.concat(this.jobs);
  }
  ready() {
    this.state = "ready";
    this.msg = (this.level ? "Level " + (this.level + 1) : this.title) + "\n\nGet ready!";
    this.after(1.8, () => { this.msg = null; this.state = "play"; Sound.fade("alarm"); });
  }
  float(s, x, y, dur) { this.floats.push({ s, x, y, t: 0, dur }); }
  addScore(n) { this.score += n; }
  // Won a level: go on, or finish if it was the last one.
  levelDone(text1, wait) {
    if (this.lastLevel) { this.msg = text1 + "\n\nWell played!"; this.after(wait, () => this.finish()); return; }
    this.msg = text1 + "\n\nNext: level " + (this.level + 2);
    this.after(wait, () => { this.level++; this.msg = null; this.jobs = []; this.floats = []; this.build(); this.ready(); });
  }
  finish() {
    if (this.test || this.score <= Save.hs(this.hsId).score) { go(menu); return; }
    this.state = "name"; this.dim = true; this.msg = null;
    Sound.play("tb_highscore");
    const start = (Save.d.last + "   ").slice(0, 3);
    this.entry = { c: [...start].map(ch => Math.max(LETTERS.indexOf(ch), 0)), pos: 0 };
    Input.typed.length = 0;
  }
  confirmName() {
    const name = this.entry.c.map(i => LETTERS[i]).join("");
    Save.d.hs[this.hsId] = { score: this.score, name: name.trim() || "---" };
    Save.d.last = name; Save.write();
    this.state = "win"; this.entry = null;
    this.msg = "New record!\n\n" + pad5(this.score) + "  " + name;
    this.after(2, () => go(menu));
  }
  slot(i) { return { x: 240 + (i - 1) * 38 - 16, y: 126, w: 32, h: 36 }; }
  updateName() {
    const e = this.entry, n = LETTERS.length;
    const nudge = (d, i = e.pos) => { e.c[i] = mod(e.c[i] + d, n); Sound.play("hop"); };
    for (const ch of Input.typed) {
      const i = LETTERS.indexOf(ch);
      if (i >= 0 && ch !== " ") { e.c[e.pos] = i; e.pos = Math.min(e.pos + 1, 2); Sound.play("hop"); }
    }
    Input.typed.length = 0;
    if (Input.just.up) nudge(1);
    else if (Input.just.down) nudge(-1);
    else if (Input.just.left) e.pos = Math.max(e.pos - 1, 0);
    else if (Input.just.right) e.pos = Math.min(e.pos + 1, 2);
    else if (Input.just.a) { if (e.pos === 2) { this.confirmName(); return; } e.pos++; }
    for (const p of Input.taps) {
      if (hits(p, { x: 205, y: 202, w: 70, h: 28 })) { this.confirmName(); return; }
      for (let i = 0; i < 3; i++) {
        const s = this.slot(i), col = p.x >= s.x - 3 && p.x < s.x + s.w + 3;
        if (col && p.y >= 100 && p.y < 128) { e.pos = i; nudge(1, i); }
        else if (col && p.y >= 128 && p.y < 160) e.pos = i;
        else if (col && p.y >= 160 && p.y < 192) { e.pos = i; nudge(-1, i); }
      }
    }
  }
  drawName() {
    const e = this.entry;
    text("New record!", 240, 72, { size: 16, color: "#fff27f" });
    text(pad5(this.score), 240, 90, { size: 14 });
    const blink = Math.floor(performance.now() / 250) % 2 === 0;
    e.c.forEach((c, i) => {
      const s = this.slot(i), on = i === e.pos, x = s.x + s.w / 2;
      rounded(s.x, s.y, s.w, s.h, 5); ctx.fillStyle = on ? "rgba(255,242,127,.2)" : "rgba(255,255,255,.08)"; ctx.fill();
      if (on && blink) { ctx.strokeStyle = "#fff27f"; ctx.lineWidth = 1.5; ctx.stroke(); }
      text(LETTERS[c] === " " ? "_" : LETTERS[c], x, s.y + s.h / 2 + 1, { size: 22, color: on ? "#fff27f" : "#fff" });
      poly([[x, 110], [x + 8, 121], [x - 8, 121]], on ? "#fff27f" : "#8fb8c8");
      poly([[x, 178], [x + 8, 167], [x - 8, 167]], on ? "#fff27f" : "#8fb8c8");
    });
    rounded(205, 202, 70, 28, 6); ctx.fillStyle = "#ffe066"; ctx.fill();
    text("OK", 240, 217, { size: 15, color: "#06202b" });
    if (!Input.touchMode) text("Arrows pick, Space confirms, or type", 240, 242, { size: 10, color: "#9cc3d0" });
  }
  updateFloats(dt) { this.floats = this.floats.filter(f => (f.t += dt) < f.dur); }
  drawFloats(rise) {
    for (const f of this.floats) {
      ctx.globalAlpha = 1 - f.t / f.dur;
      text(f.s, f.x, f.y - rise * f.t / f.dur, { size: 11, outline: "#03121a" });
    }
    ctx.globalAlpha = 1;
  }
  // The left panel: score, lives, level, high score.
  drawLeft(label, life) {
    const hs = Save.hs(this.hsId), c = { size: 11, color: label };
    const lives = (y, w) => { const n = Math.max(3, this.lives); for (let i = 0; i < this.lives; i++) life(59 - (n * (w + 6) - 6) / 2 + i * (w + 6), y); };
    if (View.portrait) {
      text("Score", 172, -27, { size: 9.5, color: label }); text(pad5(this.score), 172, -13, { size: 14 });
      text("Lives", 222, -27, { size: 9.5, color: label });
      if (this.lives > 0) { life(220 - life.w, -21); text("\u00d7" + this.lives, 224, -14, { size: 13, align: "left" }); }
      text("Best " + hs.name, 272, -27, { size: 9.5, color: "#ffd94d" }); text(pad5(hs.score), 272, -13, { size: 14, color: "#ffd94d" });
      return;
    }
    if (Input.touchMode) {
      text("Score", 59, 12, c); text(pad5(this.score), 59, 25, { size: 15 });
      text("Lives", 59, 46, c); lives(55, life.w);
      text("High score", 59, 86, { size: 11, color: "#ffd94d" });
      text(pad5(hs.score) + "  " + hs.name, 59, 99, { size: 12, color: "#ffd94d" });
      return;
    }
    text("Score", 59, 21, c); text(pad5(this.score), 59, 36, { size: 16 });
    text("Lives", 59, 69, c); lives(78, life.w);
    text("Level", 59, 115, c); text(this.levelLabel, 59, 131, { size: 16 });
    text("High score", 59, 165, { size: 11, color: "#ffd94d" });
    text(pad5(hs.score), 59, 181, { size: 18, color: "#ffd94d" });
    text(hs.name, 59, 199, { size: 18 });
  }
  drawMessage(cy) {
    if (!this.msg) return;
    const ls = this.msg.split("\n"), lh = 11.5;
    ls.forEach((l, i) => text(l, 240, cy + (i - (ls.length - 1) / 2) * lh, { size: 12, color: "#fff27f", outline: "#03121a" }));
  }
}


/* =========================================================================
   IGLOO BUILDER - Pengo turned into a building puzzle.
   Push ice blocks onto the red outline and lock them in place to build each level's igloo.
   A pushed block slides until it hits something; a block that cannot move at all is crushed, and turns up
   again somewhere else a while later. A clock runs: the faster the igloo is built, the bigger the time bonus.
   Seals wander about and shove loose blocks out of place; polar bears hunt the inuit.
   Graphics are drawn in code for now, ready to be swapped for a sprite sheet (see IglooArt).
   ========================================================================= */
const IG = { N: 13, CELL: 16, OX: 136, OY: 31, WALK: 5, SLIDE: 13 };
const IG_DIRS = { up: [-1, 0], right: [0, 1], down: [1, 0], left: [0, -1] };
const igX = c => IG.OX + c * IG.CELL, igY = r => IG.OY + r * IG.CELL;

// Cells inside an igloo: closed off from the field's edge by the outline (a one-cell gap opening to the outside
// is the door, and counts as outside). target: 13 x 13 booleans.
function igInterior(target) {
  const N = IG.N, T = (r, c) => r >= 0 && c >= 0 && r < N && c < N && target[r][c];
  const gap = (r, c) => !T(r, c) && ((T(r, c - 1) && T(r, c + 1)) || (T(r - 1, c) && T(r + 1, c)));
  const out = target.map(row => row.map(() => false)), st = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++)
    if ((r === 0 || c === 0 || r === N - 1 || c === N - 1) && !T(r, c) && !gap(r, c)) { out[r][c] = true; st.push([r, c]); }
  while (st.length) {
    const [r, c] = st.pop();
    for (const [dr, dc] of Object.values(IG_DIRS)) {
      const a = r + dr, b = c + dc;
      if (a >= 0 && b >= 0 && a < N && b < N && !out[a][b] && !T(a, b) && !gap(a, b)) { out[a][b] = true; st.push([a, b]); }
    }
  }
  const door = (r, c) => gap(r, c) && Object.values(IG_DIRS).some(([dr, dc]) => out[r + dr] && out[r + dr][c + dc]);
  return target.map((row, r) => row.map((t, c) => !t && !out[r][c] && !door(r, c)));
}
