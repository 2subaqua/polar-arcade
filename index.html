// Is a gamepad plugged in? (Checked at most twice a second.)
let igPadT = 0, igPadOn = false;
function igPadConnected() {
  const now = performance.now();
  if (now - igPadT > 500) { igPadT = now; try { igPadOn = [...(navigator.getGamepads ? navigator.getGamepads() : [])].some(p => p && p.connected); } catch (e) { igPadOn = false; } }
  return igPadOn;
}
// The four buttons on the right of a gamepad as a little diamond, with one of them lit.
function igPadIcon(x, y, lit) {
  for (const [b, dx, dy] of [["up", 0, -3.6], ["right", 3.6, 0], ["down", 0, 3.6], ["left", -3.6, 0]]) {
    ctx.beginPath(); ctx.arc(x + dx, y + dy, 1.9, 0, TAU);
    if (b === lit) { ctx.fillStyle = "#ffd94d"; ctx.fill(); }
    else { ctx.strokeStyle = "#7fa9bb"; ctx.lineWidth = 0.8; ctx.stroke(); }
  }
}

class Igloo extends Game {
  constructor() {
    super("igloo", "Igloo Builder");
    this.lives = 3; this.prefix = "";
    this.build(); this.ready();
  }
  ready() {
    super.ready();
    this.msg = (this.level ? "Level " + (this.level + 1) : this.title) + "\n" + (this.c.name || "") + "\n\nGet ready!";
  }
  build() {
    const c = this.c = this.cfg, N = IG.N;
    // g: 0 snow, 1 loose ice, 2 locked, 3 packed snow, 4 door, 5 a planted ice pick, 6 a hole in the ice
    this.g = []; this.target = []; this.crack = []; this.slick = []; this.gold = [];
    for (let r = 0; r < N; r++) {
      this.g.push([]); this.target.push([]); this.crack.push([]); this.slick.push([]);
      for (let k = 0; k < N; k++) {
        const ch = c.map[r][k];
        this.g[r].push("#*G".includes(ch) ? 1 : ch === "X" ? 2 : ch === "S" ? 3 : ch === "D" ? 4 : ch === "H" ? 6 : 0);
        this.target[r].push("oX*".includes(ch));
        this.crack[r].push(ch === "K" ? 1 : 0);
        this.slick[r].push(ch === "~");
        if (ch === "G") this.gold.push([r, k]);
        if (ch === "P") this.start = [r, k];
      }
    }
    this.goldDone = this.gold.length < 3;
    this.snowballs = 0; this.picks = 0;
    this.targets = this.target.flat().filter(Boolean).length;
    this.inside = igInterior(this.target);
    this.resetActors();
    this.levelT = 0; this.iceBack = []; this.eventT = this.c.eventFirst;
  }
  resetActors() {
    const [r, k] = this.freeNear(this.start);
    this.me = { r, c: k, x: k, y: r, dir: "up", moving: false, walk: 0, dizzy: 0, dead: false };
    this.slides = []; this.bits = []; this.enemies = []; this.balls = []; this.items = [];
    this.spawnT = { seal: this.c.firstSeal, bear: this.c.firstBear };
    this.itemT = rnd(...this.c.itemGap) * 0.6;
    this.eventT = this.eventT || this.c.eventFirst;
    this.storm = null; this.aurora = 0; this.cocoa = 0; if (Wind.on) Wind.stop();
    this.iceBack = this.iceBack || [];
  }
  freeNear([r, c]) {
    if (this.g[r][c] === 0) return [r, c];
    for (let d = 1; d < IG.N; d++) for (let dr = -d; dr <= d; dr++) for (let dc = -d; dc <= d; dc++) {
      const a = r + dr, b = c + dc;
      if (this.inGrid(a, b) && this.g[a][b] === 0) return [a, b];
    }
    return [r, c];
  }
  inGrid(r, c) { return r >= 0 && c >= 0 && r < IG.N && c < IG.N; }
  free(r, c) { return this.inGrid(r, c) && this.g[r][c] === 0; }
  get locked() { let n = 0; for (let r = 0; r < IG.N; r++) for (let c = 0; c < IG.N; c++) if (this.g[r][c] === 2 && this.target[r][c]) n++; return n; }
  // The time bonus shrinks from bonus x targets to nothing over secsPerTarget x targets seconds.
  get timeBonus() {
    const max = this.c.bonus * this.targets, limit = this.c.secsPerTarget * this.targets;
    return Math.round(max * Math.max(0, 1 - this.levelT / limit) / 10) * 10;
  }
  get clock() { const s = Math.floor(this.levelT); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  get loose() { let n = 0; for (const row of this.g) for (const v of row) if (v === 1) n++; return n; }
  saveData() {
    return { g: this.g.map(r => r.join("")), t: this.levelT, ice: this.iceBack.length, crack: this.crack.map(r => r.join("")),
      gold: this.gold, goldDone: this.goldDone, snowballs: this.snowballs, picks: this.picks };
  }
  loadData(d) {
    if (d.g) this.g = d.g.map(r => [...r].map(Number));
    if (d.crack) this.crack = d.crack.map(r => [...r].map(Number));
    if (d.gold) { this.gold = d.gold; this.goldDone = d.goldDone; }
    this.snowballs = d.snowballs || 0; this.picks = d.picks || 0;
    this.levelT = d.t || 0; this.resetActors();
    this.iceBack = Array.from({ length: d.ice || 0 }, () => this.c.iceBack);
  }

  addScore(n) { super.addScore(this.aurora > 0 ? n * 2 : n); }
  // Points shown over the field are what you actually get: doubled under the northern lights.
  float(t, ...rest) { super.float(this.aurora > 0 && /^\d+$/.test(t) ? String(+t * 2) : t, ...rest); }
  isGold(r, c) { return this.gold.findIndex(([y, x]) => y === r && x === c); }

  /* ---- update ---------------------------------------------------------- */
  // The tune plays while the level is on, carries on where it was after a pause or a lost life, and stops
  // when the game is over.
  music() {
    const want = this.state !== "lose" && this.state !== "name" && !this.musicOver, live = Sound.live.music;
    if (want && (!live || live.tag !== "icepalace") && Sound.ac && Sound.ac.state === "running") Sound.playSid(icePalace(), 2, "music", 2, "icepalace");
    else if (!want && live && live.sid) Sound.stop("music");
  }
  update(dt) {
    this.t += dt;
    this.music();
    this.runJobs(dt); this.updateFloats(dt);
    this.bits = this.bits.filter(b => (b.t += dt) < b.dur);
    if (this.state === "name") { Input.touch = {}; this.updateName(); return; }
    Input.touch = Input.touchMode ? Pads.readIgloo() : {};
    this.updateSlides(dt);
    if (this.state !== "play") { if (Wind.on) Wind.stop(); return; }
    this.levelT += dt;
    for (const p of Input.taps) if (hits(p, this.retryBox)) { this.retry(); return; }
    if (Input.typed.includes("R")) { Input.typed.length = 0; this.retry(); return; }
    Input.typed.length = 0;
    this.control(dt);
    this.updateBalls(dt);
    this.updateItems(dt);
    this.updateEvents(dt);
    this.updateIceBack(dt);
    this.spawn(dt);
    for (const e of this.enemies) this.updateEnemy(e, dt);
    this.enemies = this.enemies.filter(e => !e.gone);
    this.checkTouch();
  }
  // A walker (the inuit or an animal) moves from cell to cell. Returns true when it is standing on a cell.
  stepWalker(a, speed, dt) {
    if (!a.moving) return true;
    const [dr, dc] = IG_DIRS[a.dir];
    a.walk += dt;
    const tx = a.c + dc, ty = a.r + dr, s = speed * dt;
    a.x += dc * s; a.y += dr * s;
    if ((dc && (a.x - tx) * dc >= 0) || (dr && (a.y - ty) * dr >= 0)) { a.r = ty; a.c = tx; a.x = tx; a.y = ty; a.moving = false; return true; }
    return false;
  }
  canEnter(r, c) { return this.free(r, c) && !this.slides.some(s => s.to[0] === r && s.to[1] === c); }
  control(dt) {
    const m = this.me, held = a => Input.held[a] || Input.touch[a];
    if (m.carry) return;
    if (m.dizzy > 0) { m.dizzy -= dt; return; }
    if (this.cocoa > 0) this.cocoa -= dt;
    const pr = m.r, pc = m.c;
    if (!this.stepWalker(m, this.cocoa > 0 ? IG.WALK * 1.6 : IG.WALK, dt)) return;
    if (m.r !== pr || m.c !== pc) {
      this.leftCell(pr, pc);
      this.pickUp(m.r, m.c);
      // slick ice: keep sliding the same way until something is in the way
      if (this.slick[m.r][m.c] && this.canEnter(m.r + IG_DIRS[m.dir][0], m.c + IG_DIRS[m.dir][1])) {
        if (!m.sliding) Sound.play("mb_swish");
        m.moving = true; m.sliding = true; return;
      }
    }
    m.sliding = false;
    const want = ["up", "down", "left", "right"].find(held);
    if (m.pushT > 0) m.pushT -= dt;
    const fr = m.r + IG_DIRS[m.dir][0], fc = m.c + IG_DIRS[m.dir][1];
    if (Input.just.a) {
      if (want) m.dir = want;
      const ar = m.r + IG_DIRS[m.dir][0], ac = m.c + IG_DIRS[m.dir][1];
      if (this.snowballs > 0 && this.inGrid(ar, ac) && (this.g[ar][ac] === 0 || this.g[ar][ac] === 6)) { this.throwBall(); return; }
      m.pushT = 0.25; this.push(m.r, m.c, m.dir, true); return;
    }
    if (Input.just.x) {
      if (want) m.dir = want;
      if (this.snowballs > 0) this.throwBall(); else { Sound.play("mb_nope"); this.float("No snowballs", igX(m.c) + 8, igY(m.r), 0.6); }
      return;
    }
    if (Input.just.y) {
      if (this.picks > 0 && this.canEnter(fr, fc) && !this.target[fr][fc] && !this.enemies.some(e => Math.abs(e.x - fc) < 0.8 && Math.abs(e.y - fr) < 0.8)) {
        this.g[fr][fc] = 5; this.picks--; Sound.play("mb_stamp"); this.float("Ice pick", igX(fc) + 8, igY(fr), 0.8);
      } else { Sound.play("mb_nope"); this.float(this.picks ? "Not here" : "No ice pick", igX(m.c) + 8, igY(m.r), 0.6); }
      return;
    }
    if (Input.just.b) {
      if (this.picks > 0 && this.canEnter(fr, fc) && !this.target[fr][fc] && !this.enemies.some(e => Math.abs(e.x - fc) < 0.8 && Math.abs(e.y - fr) < 0.8)) {
        this.g[fr][fc] = 5; this.picks--; Sound.play("mb_stamp"); this.float("Ice pick", igX(fc) + 8, igY(fr), 0.8); return;
      }
      this.lock(fr, fc); return;
    }
    m.trying = false;
    if (!want) return;
    m.dir = want;
    const [dr, dc] = IG_DIRS[want];
    if (this.canEnter(m.r + dr, m.c + dc)) m.moving = true;
    else { m.trying = true; m.walk += dt; }       // walking into a wall or a block: the legs keep going
  }
  // Push the block in front of a walker. The inuit crushes a block that cannot move; seals just give up.
  push(r, c, dir, byPlayer) {
    const [dr, dc] = IG_DIRS[dir], br = r + dr, bc = c + dc;
    if (!this.inGrid(br, bc)) { if (byPlayer) this.stamp(dir); return false; }
    if (this.g[br][bc] >= 2) { if (byPlayer) Sound.play("mb_thud"); return false; }
    if (this.g[br][bc] !== 1 || this.slides.some(s => s.to[0] === br && s.to[1] === bc)) return false;
    const blocked = (y, x) => !this.inGrid(y, x) || this.g[y][x] !== 0 || this.slides.some(s => s.to[0] === y && s.to[1] === x) ||
      (byPlayer && ((this.me.r === y && this.me.c === x) || (this.me.moving && this.me.r + IG_DIRS[this.me.dir][0] === y && this.me.c + IG_DIRS[this.me.dir][1] === x)));
    let er = br, ec = bc, fill = false;
    for (;;) {
      const nr = er + dr, nc = ec + dc;
      if (this.inGrid(nr, nc) && this.g[nr][nc] === 6 && !this.slides.some(s => s.to[0] === nr && s.to[1] === nc)) { er = nr; ec = nc; fill = true; break; }
      if (blocked(nr, nc)) break;
      er = nr; ec = nc;
    }
    const gi = this.isGold(br, bc);
    if (er === br && ec === bc) {
      if (!byPlayer) return false;
      if (gi >= 0) { Sound.play("mb_thud"); this.float("Too precious!", igX(bc) + 8, igY(br), 0.8); return false; }
      this.g[br][bc] = 0; this.crushBits(br, bc); Sound.play("mb_crush");
      this.iceBack.push(this.c.iceBack);              // the ice comes back somewhere after a while
      return true;
    }
    this.g[br][bc] = 0;
    if (!fill) this.g[er][ec] = 1;
    if (gi >= 0) { if (fill) this.gold.splice(gi, 1); else this.gold[gi] = [er, ec]; }
    this.slides.push({ x: bc, y: br, to: [er, ec], dir, chain: 0, bySeal: !byPlayer, fill, gold: gi >= 0 });
    Sound.play("mb_push");
    return true;
  }
  updateSlides(dt) {
    for (const s of this.slides) {
      const [dr, dc] = IG_DIRS[s.dir], v = IG.SLIDE * dt;
      s.x += dc * v; s.y += dr * v;
      const done = (dc && (s.x - s.to[1]) * dc >= 0) || (dr && (s.y - s.to[0]) * dr >= 0);
      if (done) { s.x = s.to[1]; s.y = s.to[0]; s.done = true; Sound.play("mb_bump"); }
      // an animal in the way is caught by the block and carried along until the block stops
      for (const e of this.enemies) if (!e.flat && !e.carry && !(e.spawning > 0) && Math.abs(e.x - s.x) < 0.7 && Math.abs(e.y - s.y) < 0.7) {
        e.carry = s; e.moving = false; s.caught = (s.caught || 0) + 1;
        const pts = e.kind === "bear" ? 400 : 200;
        s.pts = (s.pts || 0) + pts;
        this.addScore(pts); this.float(String(pts), igX(e.x) + 8, igY(e.y), 1); Sound.play("mb_squash");
        if (s.caught === 2) { this.addScore(s.pts); this.float("Double!", igX(e.x) + 8, igY(e.y) - 10, 1.4); }   // the first one counts double too
        else if (s.caught > 2) this.addScore(pts);
        this.respawnLater(e.kind);
      }
      // a block shoved by a seal does the same to the inuit
      const m = this.me;
      if (s.bySeal && !m.carry && !m.dead && this.state === "play" && Math.abs(m.x - s.x) < 0.7 && Math.abs(m.y - s.y) < 0.7) {
        m.carry = s; m.moving = false; Sound.play("mb_squash");
      }
      if (m.carry === s) {
        m.x = s.x + dc * 0.55; m.y = s.y + dr * 0.55;
        if (s.done) { m.carry = null; m.r = Math.round(m.y); m.c = Math.round(m.x); this.caught(); }
      }
      for (const e of this.enemies) if (e.carry === s) {
        e.x = s.x + dc * 0.55; e.y = s.y + dr * 0.55;
        if (s.done) { e.flat = 1.2; e.carry = null; e.r = Math.round(e.y); e.c = Math.round(e.x); }
      }
      if (s.done && s.caught >= 2) Sound.play("tb_combo");
      if (s.done && s.fill) this.fillHole(s.to[0], s.to[1]);
    }
    const before = this.slides.length;
    this.slides = this.slides.filter(s => !s.done);
    if (before && !this.slides.length) this.checkGold();
  }
  lock(r, c) {
    if (!this.inGrid(r, c) || this.g[r][c] !== 1 || this.slides.some(s => s.to[0] === r && s.to[1] === c)) return;
    if (!this.target[r][c]) { Sound.play("mb_nope"); this.float("not here", igX(c) + 8, igY(r), 0.7); return; }
    this.g[r][c] = 2;
    const gi = this.isGold(r, c); if (gi >= 0) this.gold.splice(gi, 1);
    this.addScore(50); this.float("50", igX(c) + 8, igY(r), 0.8); Sound.play("mb_lock");
    for (let k = 0; k < 8; k++) this.bits.push({ x: igX(c) + 8, y: igY(r) + 8, a: k / 8 * TAU, t: 0, dur: 0.5, kind: "spark", first: !k });
    if (this.locked === this.targets) this.won();
  }
  // Pushing against the outer wall shakes it: animals right beside that wall are stunned for a while.
  stamp(dir) {
    Sound.play("mb_stamp"); this.shake = 0.25;
    for (const e of this.enemies) {
      if (e.flat || e.carry || e.spawning > 0) continue;
      const near = dir === "up" ? e.y < 0.6 : dir === "down" ? e.y > IG.N - 1.6 : dir === "left" ? e.x < 0.6 : e.x > IG.N - 1.6;
      if (near) e.stun = 3.5;
    }
  }
  crushBits(r, c) { for (let k = 0; k < 10; k++) this.bits.push({ x: igX(c) + 8, y: igY(r) + 8, a: rnd(0, TAU), v: rnd(20, 60), t: 0, dur: 0.45, kind: "ice", first: !k }); }
  // Where a block would stop if pushed from (r, c) towards dir, with nothing else moving.
  slideEnd(r, c, [dr, dc]) {
    while (this.free(r + dr, c + dc)) { r += dr; c += dc; }
    return [r, c];
  }
  // A crushed block turns up again on free snow outside the igloos, away from the inuit and the animals.
  // Where it can, it turns up somewhere a single push would put it straight onto an open red square.
  updateIceBack(dt) {
    for (let i = 0; i < this.iceBack.length; i++) {
      if ((this.iceBack[i] -= dt) > 0) continue;
      const spots = [], good = [];
      const walk = this.distFrom(this.me.r, this.me.c);
      for (let r = 0; r < IG.N; r++) for (let c = 0; c < IG.N; c++) {
        if (!this.canEnter(r, c) || this.target[r][c] || this.inside[r][c]) continue;
        if (Math.abs(r - this.me.r) + Math.abs(c - this.me.c) < 3) continue;
        if (this.enemies.some(e => Math.abs(e.x - c) < 1.2 && Math.abs(e.y - r) < 1.2)) continue;
        spots.push([r, c]);
        this.g[r][c] = 1;                              // try it: is there a push that lands it on a target?
        for (const d of Object.values(IG_DIRS)) {
          const mr = r - d[0], mc = c - d[1];
          if (!this.inGrid(mr, mc) || walk[mr * IG.N + mc] >= 1e9) continue;
          this.g[r][c] = 0; const [er, ec] = this.slideEnd(r, c, d); this.g[r][c] = 1;
          if ((er !== r || ec !== c) && this.target[er][ec] && this.g[er][ec] === 0) { good.push([r, c]); break; }
        }
        this.g[r][c] = 0;
      }
      if (good.length) spots.splice(0, spots.length, ...good);
      if (!spots.length) { this.iceBack[i] = 1; continue; }
      const [r, c] = pick(spots);
      this.g[r][c] = 1; this.iceBack.splice(i--, 1);
      for (let k = 0; k < 8; k++) this.bits.push({ x: igX(c) + 8, y: igY(r) + 8, a: k / 8 * TAU, t: 0, dur: 0.6, kind: "spark", first: !k });
      Sound.play("mb_pop");
    }
  }
  /* ---- holes, cracks, golden fish ------------------------------------- */
  // A block that slides into a hole sinks and fills it: the hole becomes snow, and the ice comes back later.
  fillHole(r, c) {
    this.g[r][c] = 0; this.crack[r][c] = 0;
    for (let k = 0; k < 10; k++) this.bits.push({ x: igX(c) + 8, y: igY(r) + 8, a: rnd(0, TAU), v: rnd(15, 45), t: 0, dur: 0.5, kind: "water", first: !k });
    Sound.play("mb_splash"); this.float("Plop!", igX(c) + 8, igY(r), 0.7);
    this.iceBack.push(this.c.iceBack);
  }
  // A crack gives way under the inuit: the first time over it, it groans; the second time, it breaks.
  leftCell(r, c) {
    if (!this.crack[r][c]) return;
    if (this.crack[r][c] === 1) { this.crack[r][c] = 2; Sound.play("mb_creak"); return; }
    if (this.g[r][c] !== 0) return;
    this.crack[r][c] = 0; this.g[r][c] = 6; Sound.play("mb_break");
    for (let k = 0; k < 8; k++) this.bits.push({ x: igX(c) + 8, y: igY(r) + 8, a: rnd(0, TAU), v: rnd(20, 50), t: 0, dur: 0.45, kind: "ice" });
  }
  // The three golden fish blocks side by side in a row or a column: a big bonus, and every animal is stunned.
  checkGold() {
    if (this.goldDone || this.gold.length < 3) return;
    const gs = this.gold.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const row = gs.every(g => g[0] === gs[0][0]) && gs[1][1] === gs[0][1] + 1 && gs[2][1] === gs[0][1] + 2;
    const col = gs.every(g => g[1] === gs[0][1]) && gs[1][0] === gs[0][0] + 1 && gs[2][0] === gs[0][0] + 2;
    if (!row && !col) return;
    this.goldDone = true;
    this.addScore(this.c.goldBonus);
    const [r, c] = gs[1];
    this.float("Golden shoal! " + this.c.goldBonus * (this.aurora > 0 ? 2 : 1), igX(c) + 8, igY(r) - 6, 2);
    for (const [y, x] of gs) for (let k = 0; k < 8; k++) this.bits.push({ x: igX(x) + 8, y: igY(y) + 8, a: k / 8 * TAU, t: 0, dur: 0.8, kind: "spark", first: !k });
    for (const e of this.enemies) if (!e.flat && !e.carry) e.stun = 6;
    Sound.play("tb_gold"); this.goldShine = 2;
  }

  /* ---- power-ups ------------------------------------------------------- */
  updateItems(dt) {
    if (this.c.items.length) {
      if ((this.itemT -= dt) <= 0) {
        this.itemT = rnd(...this.c.itemGap);
        const spots = [];
        for (let r = 0; r < IG.N; r++) for (let c = 0; c < IG.N; c++)
          if (this.canEnter(r, c) && !this.target[r][c] && !this.inside[r][c] && !this.slick[r][c] && !this.items.some(i => i.r === r && i.c === c)
              && Math.abs(r - this.me.r) + Math.abs(c - this.me.c) >= 3) spots.push([r, c]);
        if (spots.length) {
          const [r, c] = pick(spots);
          this.items.push({ kind: pick(this.c.items), r, c, t: this.c.itemLife });
          Sound.play("mb_pop");
        }
      }
    }
    for (const i of this.items) i.t -= dt;
    this.items = this.items.filter(i => i.t > 0 && this.g[i.r][i.c] === 0);
    this.pickUp(this.me.r, this.me.c);
  }
  pickUp(r, c) {
    const i = this.items.findIndex(i => i.r === r && i.c === c);
    if (i < 0) return;
    const it = this.items.splice(i, 1)[0], x = igX(c) + 8, y = igY(r);
    Sound.play("mb_pickup"); this.addScore(100);
    if (it.kind === "fish") {
      for (const e of this.enemies) if (!e.flat && !e.carry) { e.stun = 5; e.frozen = 5; }
      this.float("Frozen!", x, y, 1); Sound.play("mb_freeze");
    } else if (it.kind === "snowballs") { this.snowballs += 3; this.float("3 snowballs", x, y, 1); }
    else if (it.kind === "pick") { this.picks++; this.float("Ice pick", x, y, 1); }
    else if (it.kind === "cocoa") { this.cocoa = 8; this.float("Hot cocoa!", x, y, 1); }
  }
  throwBall() {
    const m = this.me; this.snowballs--;
    this.balls.push({ x: m.c, y: m.r, dir: m.dir, t: 0 }); m.pushT = 0.2;
    Sound.play("mb_throw");
  }
  updateBalls(dt) {
    for (const b of this.balls) {
      const [dr, dc] = IG_DIRS[b.dir];
      b.x += dc * 11 * dt; b.y += dr * 11 * dt; b.t += dt;
      const r = Math.round(b.y + dr * 0.3), c = Math.round(b.x + dc * 0.3);
      const e = this.enemies.find(e => !e.flat && !e.carry && !(e.spawning > 0) && Math.abs(e.x - b.x) < 0.6 && Math.abs(e.y - b.y) < 0.6);
      if (e) { e.stun = Math.max(e.stun || 0, 4); b.gone = true; Sound.play("mb_hit"); this.float("Bonk!", igX(e.x) + 8, igY(e.y), 0.7); }
      else if (!this.inGrid(r, c) || (this.g[r][c] !== 0 && this.g[r][c] !== 6)) b.gone = true;
      if (b.gone) for (let k = 0; k < 6; k++) this.bits.push({ x: igX(b.x) + 8, y: igY(b.y) + 8, a: rnd(0, TAU), v: rnd(15, 35), t: 0, dur: 0.35, kind: "snow" });
    }
    this.balls = this.balls.filter(b => !b.gone);
  }

  /* ---- events: snowstorm and northern lights --------------------------- */
  updateEvents(dt) {
    if (this.aurora > 0) this.aurora -= dt;
    if (this.goldShine > 0) this.goldShine -= dt;
    if (this.storm) {
      const st = this.storm;
      if (!Wind.on) Wind.start();
      Wind.force = 3; Wind.update();
      st.t -= dt;
      if ((st.next -= dt) <= 0) { st.next = 1.3; this.blow(st.dir); }
      if (st.t <= 0) { this.storm = null; Wind.force = null; Wind.stop(); }
    }
    if (!this.c.events.length) return;
    if ((this.eventT -= dt) > 0) return;
    this.eventT = rnd(...this.c.eventGap);
    const ev = pick(this.c.events);
    if (ev === "storm") {
      const dir = pick(Object.keys(IG_DIRS));
      this.storm = { t: 10, next: 1.5, dir };
      this.float("Snowstorm!", 240, 60, 1.6);
    } else {
      this.aurora = 15; Sound.play("tb_aurora");
      this.float("Northern lights: double points!", 240, 60, 1.8);
    }
  }
  // The storm's wind shoves every loose block one cell downwind (a hole swallows it).
  blow(dir) {
    const [dr, dc] = IG_DIRS[dir], N = IG.N, cells = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (this.g[r][c] === 1 && !this.slides.some(s => s.to[0] === r && s.to[1] === c)) cells.push([r, c]);
    cells.sort((a, b) => (b[0] - a[0]) * dr + (b[1] - a[1]) * dc);      // the most downwind first
    let moved = 0;
    for (const [r, c] of cells) {
      const nr = r + dr, nc = c + dc;
      if (!this.inGrid(nr, nc) || this.target[r][c]) continue;      // a block already on the outline stays put
      if (this.me.r === nr && this.me.c === nc || this.enemies.some(e => Math.round(e.x) === nc && Math.round(e.y) === nr)) continue;
      const gi = this.isGold(r, c);
      if (this.g[nr][nc] === 6) { this.g[r][c] = 0; if (gi >= 0) this.gold.splice(gi, 1); this.fillHole(nr, nc); moved++; continue; }
      if (this.g[nr][nc] !== 0) continue;
      this.g[r][c] = 0; this.g[nr][nc] = 1; if (gi >= 0) this.gold[gi] = [nr, nc]; moved++;
      this.slides.push({ x: c, y: r, to: [nr, nc], dir, chain: 0, bySeal: false, gold: gi >= 0, wind: true });
    }
    if (moved) Sound.play("mb_push");
  }
  retry() {
    if (this.state !== "play") return;
    this.state = "lose"; this.msg = "Start over";
    this.after(1, () => this.loseLife(true));
  }
  won() {
    this.state = "won"; this.enemies.forEach(e => { e.stun = 99; });
    const bonus = this.timeBonus, time = this.clock, shown = this.aurora > 0 ? bonus * 2 : bonus;
    Sound.play("tb_win");
    this.after(1.2, () => { if (bonus) this.addScore(bonus); });
    this.levelDone("Igloo built!\nTime " + time + "   Bonus " + shown + (shown !== bonus ? " (x2)" : ""), 3.4);
  }
  // Lose a life. rebuild: start the level over, with the blocks where they were at the start.
  loseLife(rebuild) {
    this.lives--;
    if (this.lives <= 0) { this.state = "lose"; this.musicOver = true; this.msg = "Game over"; Sound.play("tb_lose"); this.after(2.5, () => this.finish()); return; }
    this.msg = null;
    if (rebuild) this.build(); else this.resetActors();
    this.ready();
  }
  caught() {
    this.state = "lose"; this.me.dead = true; Sound.play("mb_playerdie");
    this.after(1.6, () => this.loseLife(false));
  }

  /* ---- seals and polar bears -------------------------------------------- */
  respawnLater(kind) { this.spawnT[kind] = Math.min(this.spawnT[kind] || 99, this.c.respawn); }
  spawn(dt) {
    for (const kind of ["seal", "bear"]) {
      const want = kind === "seal" ? this.c.seals : this.c.bears;
      const have = this.enemies.filter(e => e.kind === kind && !e.flat).length;
      if (have >= want) continue;
      this.spawnT[kind] -= dt;
      if (this.spawnT[kind] > 0) continue;
      this.spawnT[kind] = this.c.spawnGap;
      const spots = [];
      for (let r = 0; r < IG.N; r++) for (let c = 0; c < IG.N; c++)
        if (this.free(r, c) && Math.abs(r - this.me.r) + Math.abs(c - this.me.c) >= 7) spots.push([r, c]);
      if (!spots.length) continue;
      const [r, c] = pick(spots);
      this.enemies.push({ kind, r, c, x: c, y: r, dir: pick(["up", "down", "left", "right"]), moving: false, walk: 0, spawning: 0.8, stun: 0 });
      Sound.play("mb_pop");
    }
  }
  updateEnemy(e, dt) {
    if (e.carry) return;
    if (e.flat) { if ((e.flat -= dt) <= 0) e.gone = true; return; }
    if (e.spawning > 0) { e.spawning -= dt; return; }
    if (e.frozen > 0) e.frozen -= dt;
    if (e.stun > 0) { e.stun -= dt; return; }
    if (e.pause > 0) { e.pause -= dt; return; }
    const speed = e.kind === "bear" ? this.c.bearSpeed : this.c.sealSpeed;
    if (!this.stepWalker(e, speed, dt)) return;
    const opts = Object.keys(IG_DIRS).filter(d => this.canEnter(e.r + IG_DIRS[d][0], e.c + IG_DIRS[d][1]));
    if (e.kind === "seal") {
      // a seal now and then shoves the block in front of it
      const [dr, dc] = IG_DIRS[e.dir], fr = e.r + dr, fc = e.c + dc;
      if (this.inGrid(fr, fc) && this.g[fr][fc] === 1 && Math.random() < 0.45 && this.push(e.r, e.c, e.dir, false)) { e.pause = 0.5; return; }
      const back = { up: "down", down: "up", left: "right", right: "left" }[e.dir];
      const fwd = opts.filter(d => d !== back);
      if (opts.includes(e.dir) && Math.random() < 0.7) e.moving = true;
      else if (fwd.length || opts.length) { e.dir = pick(fwd.length ? fwd : opts); e.moving = true; }
      else e.dir = pick(Object.keys(IG_DIRS));
      return;
    }
    // a bear walks the shortest way to the inuit (now and then a random step, so it can be led astray)
    if (!opts.length) return;
    const dist = this.distFrom(this.me.r, this.me.c);
    let best = opts[0];
    if (Math.random() < 0.18) best = pick(opts);
    else for (const d of opts) {
      const v = dist[(e.r + IG_DIRS[d][0]) * IG.N + e.c + IG_DIRS[d][1]], b = dist[(e.r + IG_DIRS[best][0]) * IG.N + e.c + IG_DIRS[best][1]];
      if (v < b) best = d;
    }
    e.dir = best; e.moving = true;
  }
  distFrom(r0, c0) {
    const N = IG.N, d = new Array(N * N).fill(1e9), q = [[r0, c0]];
    d[r0 * N + c0] = 0;
    while (q.length) {
      const [r, c] = q.shift();
      for (const [dr, dc] of Object.values(IG_DIRS)) {
        const a = r + dr, b = c + dc;
        if (this.free(a, b) && d[a * N + b] > d[r * N + c] + 1) { d[a * N + b] = d[r * N + c] + 1; q.push([a, b]); }
      }
    }
    return d;
  }
  checkTouch() {
    const m = this.me;
    for (const e of this.enemies) {
      if (m.carry) return;
      if (e.flat || e.carry || e.spawning > 0 || Math.abs(e.x - m.x) > 0.7 || Math.abs(e.y - m.y) > 0.7) continue;
      if (e.stun > 0) {                         // a stunned animal is chased off by walking into it
        e.flat = 0.5; e.shoo = true; this.addScore(100); this.float("100", igX(e.x) + 8, igY(e.y), 0.8); Sound.play("mb_squash"); this.respawnLater(e.kind);
      } else if (e.kind === "bear") { this.caught(); return; }
      else if (m.dizzy <= 0) { m.dizzy = 0.9; Sound.play("mb_bark"); }   // seals only knock you dizzy
    }
  }

  /* ---- drawing ---------------------------------------------------------- */
  get retryBox() { return View.portrait ? { x: 122, y: 244, w: 24, h: 24 } : { x: 396, y: 4, w: 26, h: 26 }; }
  draw() {
    View.fill("#0b3047");
    for (let k = 0; k < 50; k++) {                   // snow falling in the side panels
      const x = mod(k * 89 + Math.sin(this.t + k) * 6, 480), y = mod(k * 47 + this.t * (8 + k % 4 * 4), 300) - 15;
      if (x > 128 && x < 352) continue;
      rect(x, y, 1.5, 1.5, "rgba(255,255,255,.6)");
    }
    const sh = this.shake > 0 ? (this.shake -= STEP, Math.sin(this.t * 90) * 2) : 0;
    ctx.save(); ctx.translate(sh, 0);
    IglooArt.field(this);
    for (let r = 0; r < IG.N; r++) for (let c = 0; c < IG.N; c++) {
      if (this.slick[r][c]) IglooArt.slick(igX(c), igY(r), this.t);
      if (this.crack[r][c] && this.g[r][c] !== 6) IglooArt.crack(igX(c), igY(r), this.crack[r][c]);
      if (this.g[r][c] === 6) IglooArt.hole(igX(c), igY(r), this.t);
      if (this.g[r][c] === 5) IglooArt.pickPlanted(igX(c), igY(r));
      if (this.target[r][c]) IglooArt.target(igX(c), igY(r), this.t, this.g[r][c] === 2);
      if (this.g[r][c] === 3) IglooArt.mound(igX(c), igY(r), (y, x) => this.inGrid(y, x) && this.g[y][x] === 3);
      else if (this.g[r][c] === 4) IglooArt.door(igX(c), igY(r));
      else if (this.g[r][c] === 2) IglooArt.locked(igX(c), igY(r), this.target[r][c], this.state === "won" ? this.t * 3 - (r + c) * 0.25 : null);
      else if (this.g[r][c] === 1 && !this.slides.some(s => s.to[0] === r && s.to[1] === c)) {
        if (this.isGold(r, c) >= 0) IglooArt.gold(igX(c), igY(r), this.t, this.goldShine > 0); else IglooArt.block(igX(c), igY(r), this.target[r][c]);
      }
    }
    for (const it of this.items) IglooArt.item(it, igX(it.c), igY(it.r), this.t);
    for (const s of this.slides) {
      const y = igY(s.y) + (s.fill && s.x === s.to[1] && s.y === s.to[0] ? 3 : 0);
      if (s.gold) IglooArt.gold(igX(s.x), y, this.t, false); else IglooArt.block(igX(s.x), y, false);
    }
    for (const b of this.bits) IglooArt.bit(b);
    for (const e of this.enemies) { IglooArt.animal(e, igX(e.x), igY(e.y), this.t); if (e.frozen > 0 && e.stun > 0) IglooArt.frozen(igX(e.x), igY(e.y), e.frozen); }
    for (const b of this.balls) IglooArt.snowball(igX(b.x) + 8, igY(b.y) + 9);
    const m = this.me;
    if (this.state !== "name") IglooArt.inuit(igX(m.x), igY(m.y), m.dir, (m.moving || m.trying) && !m.sliding ? m.walk + 0.001 : 0, m.dead, m.dizzy > 0, this.state === "won" ? this.t : 0, m.pushT > 0);
    if (this.aurora > 0) IglooArt.aurora(this.t, Math.min(1, this.aurora / 2, (15 - this.aurora) / 1.5));
    if (this.storm) IglooArt.storm(this.t, this.storm.dir, Math.min(1, this.storm.t / 1.5, (10 - this.storm.t) / 1.5));
    this.drawFloats(14);
    ctx.restore();
    if (paused && Wind.on && scene === this) Wind.stop();
    const life = (x, y) => IglooArt.head(x + 7, y + 8, 0.8);
    life.w = 14;
    this.drawLeft("#bfeaff", life);
    this.drawRight();
    if (this.state === "play") {                     // the start-over button beside the pause button
      const r = this.retryBox, [x, y] = UI.back(r);
      ctx.beginPath(); ctx.arc(x, y, 6, -2.6, 2.2); ctx.strokeStyle = "#cdeaf2"; ctx.lineWidth = 1.8; ctx.stroke();
      poly([[x - 6.5, y - 7.5], [x - 1.5, y - 4.5], [x - 7.5, y - 1.5]], "#cdeaf2");
    }
    if (this.dim) rect(120, 0, 240, 270, "rgba(2,14,20,.8)");
    // Over the field's middle, but when the igloo is done, at the top or bottom, away from the cheering inuit.
    this.drawMessage(this.state === "won" ? (this.me.y < 6.5 ? 205 : 62) : 135);
    if (this.state === "name") this.drawName();
  }
  // What the inuit carries and what is going on, shortest first.
  statusLines() {
    const out = [], s = t => Math.ceil(t) + " s";
    if (this.aurora > 0) out.push("Double points " + s(this.aurora));
    if (this.storm) out.push("Snowstorm " + s(this.storm.t));
    if (this.cocoa > 0) out.push("Cocoa " + s(this.cocoa));
    if (this.snowballs) out.push("Snowballs " + this.snowballs);
    if (this.picks) out.push("Ice picks " + this.picks);
    const fr = Math.max(0, ...this.enemies.map(e => e.frozen || 0));
    if (fr > 0) out.push("Frozen " + s(fr));
    return out;
  }
  drawRight() {
    if (View.portrait) {
      text(this.locked + " / " + this.targets + "     Time " + this.clock + "     Bonus " + this.timeBonus, 252, 252, { size: 10.5, color: "#ffffff", outline: "#0b3047" });
      const st = this.statusLines().join("   ");
      if (st) text(st, 252, 264, { size: 9, color: "#bfeaff", outline: "#0b3047" });
      if (this.state !== "name" && Input.touchMode) Pads.drawIgloo();
      return;
    }
    text("Igloo", 421, 46, { size: 15, color: "#bfeaff" });
    text("Builder", 421, 62, { size: 15, color: "#ffffff" });
    text(this.c.name || "", 421, 80, { size: 10, color: "#8fc8de" });
    IglooArt.locked(398, 92, true, null); text(this.locked + " / " + this.targets, 418, 100, { size: 13, align: "left" });
    text("Ice left " + this.loose, 421, 120, { size: 10, color: "#8fc8de" });
    if (this.iceBack.length) text("More ice in " + Math.ceil(Math.min(...this.iceBack)) + " s", 421, 165, { size: 9.5, color: "#bfeaff" });
    text("Time " + this.clock, 421, 178, { size: 12, color: "#ffffff" });
    text("Bonus " + this.timeBonus, 421, 191, { size: 11, color: "#ffd94d" });
    this.statusLines().slice(0, 3).forEach((s, i) => text(s, 421, 132 + i * 11, { size: 9.5, color: i === 0 && this.aurora > 0 ? "#c8ffb0" : "#ffffff" }));
    if (!Input.touchMode && igPadConnected()) {
      // a gamepad: the four buttons on the right, as a diamond, with the one that does it lit up
      [["down", "Push"], ["right", "Lock"], ["left", "Throw snowball"], ["up", "Plant ice pick"]].forEach(([b, s], i) => {
        const y = 205 + i * 14.5;
        igPadIcon(372, y, b); text(s, 384, y, { size: 9.5, color: "#cfe9f5", align: "left" });
      });
      text("Start  pause", 421, 263, { size: 8.5, color: "#7fa9bb" });
    } else if (!Input.touchMode) {
      [["Arrows  walk", 205], ["Space  push", 215], ["X  lock", 225], ["C  throw snowball", 235], ["V  plant ice pick", 245], ["R  start over", 255]]
        .forEach(([s, y]) => text(s, 421, y, { size: 9, color: "#7fa9bb" }));
    } else if (this.state !== "name") Pads.drawIgloo();
  }
}

      else if (dizzy) f = "in_dizzy";
      else if (party) { f = "in_cheer"; py -= Math.abs(Math.sin(party * 7)) * 3; }
      else if (pushing) f = side ? "in_pushside" : dir === "up" ? "in_pushup" : "in_pushdown";
      else if (side) f = "in_walk" + (walk ? Math.floor(walk * IG_WALK_FPS.inuit) % 9 : 0);
      else f = (dir === "up" ? "in_up" : "in_down") + (walk ? [1, 0, 2, 0][Math.floor(walk * 10) % 4] : 0);
      ctx.beginPath(); ctx.ellipse(px, y + 15, 5.5, 1.6, 0, 0, TAU); ctx.fillStyle = "rgba(60,110,140,.25)"; ctx.fill();
      igSpr(f, px, py, flip);
      return;
    }
    const cx = x + 8, bob = walk ? Math.abs(Math.sin(walk * 14)) * 1.2 : 0, hop = party ? Math.abs(Math.sin(party * 7)) * 3 : 0;
    const cy = y + 9 - bob - hop;
    if (dead) { ctx.globalAlpha = 0.6; }
    ctx.beginPath(); ctx.ellipse(cx, y + 14.5, 5.5, 1.6, 0, 0, TAU); ctx.fillStyle = "rgba(60,110,140,.25)"; ctx.fill();
    // parka
    rounded(cx - 5.5, cy - 1, 11, 7.5, 3); ctx.fillStyle = "#c8743a"; ctx.fill();
    rect(cx - 5.5, cy + 4.5, 11, 1.6, "#fbf3e6");                    // fur trim
    rect(cx - 4, cy + 6, 3, 1.8, "#5a3a24"); rect(cx + 1, cy + 6, 3, 1.8, "#5a3a24");   // boots
    const side = dir === "left" ? -1 : dir === "right" ? 1 : 0;
    rect(cx + (side || 1) * 5 - 1, cy + 0.5 + (walk ? Math.sin(walk * 14) : 0), 2.5, 3, "#a85a28");   // a mitten
    if (dir === "up") { ctx.beginPath(); ctx.arc(cx, cy - 4, 6, 0, TAU); ctx.fillStyle = "#b8612c"; ctx.fill(); rect(cx - 4, cy - 9, 8, 2, "#fbf3e6"); }
    else this.head(cx + side * 1.2, cy - 4);
    if (dead) { ctx.globalAlpha = 1; text("x x", cx + side, cy - 3, { size: 6, color: "#3a2416" }); }
    if (dizzy) for (let k = 0; k < 3; k++) { const a = performance.now() / 150 + k * 2.1; rect(cx + Math.cos(a) * 6 - 1, cy - 11 + Math.sin(a) * 2, 2, 2, "#ffd23f"); }
  },
  animal(e, x, y, t) {
    if (igReady()) {
      const k = e.kind, px = x + 8, py = y + 16, side = e.dir === "left" || e.dir === "right";
      const step = e.moving ? Math.floor((e.walk || 0) * 6) % 2 : 0;
      const f = e.flat ? k + "_flat" : e.stun > 0 ? k + "_stun" : side ? k + "_walk" + (e.moving ? Math.floor((e.walk || 0) * IG_WALK_FPS[k]) % 9 : 0) : (e.dir === "up" ? k + "_up" : k + "_down") + step;
      if (e.spawning > 0) {                                       // popping up out of the snow
        const q = 1 - e.spawning / 0.8;
        ctx.beginPath(); ctx.ellipse(px, y + 13, 7, 3, 0, 0, TAU); ctx.fillStyle = "#cfe6f2"; ctx.fill();
        ctx.save(); ctx.beginPath(); ctx.rect(x - 6, y - 8, 28, 22); ctx.clip();
        igSpr(f, px, py + (1 - q) * 14, e.dir === "left"); ctx.restore(); return;
      }
      if (e.flat && e.shoo) { ctx.globalAlpha = Math.max(0, e.flat * 2); igSpr(k + "_stun", px, py, e.dir === "left"); ctx.globalAlpha = 1; return; }
      ctx.beginPath(); ctx.ellipse(px, y + 15, 6, 1.6, 0, 0, TAU); ctx.fillStyle = "rgba(60,110,140,.25)"; ctx.fill();
      igSpr(f, px, py, e.dir === "left");
      return;
    }
    const cx = x + 8, step = e.moving ? Math.sin((e.walk || 0) * 14) : 0, left = e.dir === "left";
    if (e.spawning > 0) {                                              // popping up out of the snow
      const k = 1 - e.spawning / 0.8;
      ctx.beginPath(); ctx.ellipse(cx, y + 12, 7, 3, 0, 0, TAU); ctx.fillStyle = "#cfe6f2"; ctx.fill();
      ctx.save(); ctx.beginPath(); ctx.rect(x - 4, y - 8, 24, 20); ctx.clip(); ctx.translate(0, (1 - k) * 12);
    }
    if (e.flat) { ctx.save(); ctx.translate(cx, y + 14); ctx.scale(1.4, e.shoo ? 1 : 0.3); ctx.translate(-cx, -(y + 14)); }
    ctx.beginPath(); ctx.ellipse(cx, y + 14.5, 6, 1.6, 0, 0, TAU); ctx.fillStyle = "rgba(60,110,140,.25)"; ctx.fill();
    ctx.save(); if (left) { ctx.translate(cx, 0); ctx.scale(-1, 1); ctx.translate(-cx, 0); }
    if (e.kind === "seal") {
      ctx.beginPath(); ctx.ellipse(cx - 1, y + 10, 7, 4.5, -0.15, 0, TAU); ctx.fillStyle = "#7f98ab"; ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx - 1, y + 11.5, 5, 2.4, -0.1, 0, TAU); ctx.fillStyle = "#b8c9d6"; ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 4, y + 6.5, 4, 0, TAU); ctx.fillStyle = "#7f98ab"; ctx.fill();
      poly([[cx - 7, y + 10], [cx - 10.5, y + 7.5 + step], [cx - 10.5, y + 12.5 - step]], "#6a8396");   // tail flippers
      rect(cx + 4.5, y + 5, 1.4, 1.6, "#1d2a35"); rect(cx + 2, y + 5, 1.2, 1.4, "#1d2a35");
      rect(cx + 6.5, y + 7.5, 1.6, 1.2, "#1d2a35");
      line([[cx + 6, y + 8.5], [cx + 9, y + 8]], "#dbe6ee", 0.6); line([[cx + 6, y + 9], [cx + 9, y + 9.6]], "#dbe6ee", 0.6);
    } else {
      ctx.beginPath(); ctx.ellipse(cx - 1, y + 9.5, 7, 5, 0, 0, TAU); ctx.fillStyle = "#5f7180"; ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx - 1, y + 9.5, 6.2, 4.2, 0, 0, TAU); ctx.fillStyle = "#fffaf0"; ctx.fill();
      rect(cx - 6, y + 12, 3, 3, "#fffaf0"); rect(cx + 2, y + 12 + step * 0.5, 3, 3, "#fffaf0");      // legs
      ctx.beginPath(); ctx.arc(cx + 4.5, y + 5.5, 4.4, 0, TAU); ctx.fillStyle = "#5f7180"; ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 4.5, y + 5.5, 3.7, 0, TAU); ctx.fillStyle = "#fffaf0"; ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 2, y + 1.8, 1.6, 0, TAU); ctx.arc(cx + 6.6, y + 1.8, 1.6, 0, TAU); ctx.fillStyle = "#fffaf0"; ctx.fill();
      rect(cx + 3.5, y + 4.2, 1.2, 1.4, "#1d2a35"); rect(cx + 6, y + 4.2, 1.2, 1.4, "#1d2a35");
      rect(cx + 7.2, y + 6.2, 1.8, 1.4, "#1d2a35");
    }
    ctx.restore();
    if (e.flat) ctx.restore();
    if (e.spawning > 0) ctx.restore();
    if (e.stun > 0 && e.stun < 50) for (let k = 0; k < 3; k++) { const a = t * 6 + k * 2.1; rect(cx + Math.cos(a) * 6 - 1, y - 1 + Math.sin(a) * 2, 2, 2, "#ffd23f"); }
  },
  /* ---- the new tiles, power-ups and effects. Each one uses a sprite of the same name from the sheet when
     there is one (hole, slick, crack1, crack2, gold, pick_planted, item_fish, item_snowballs, item_pick,
     item_cocoa, snowball, frozen), and the drawing below until then. Snowstorm and aurora are always drawn here. */
  hole(x, y, t) {
    if (igSpr("hole", x + 8, y + 16)) return;
    rounded(x + 1, y + 2, 14, 12, 5); ctx.fillStyle = "#cfe8f4"; ctx.fill();
    rounded(x + 2, y + 3, 12, 10, 4.5); ctx.fillStyle = "#1d5a85"; ctx.fill();
    rounded(x + 3, y + 5, 10, 7, 3.5); ctx.fillStyle = "#123f63"; ctx.fill();
    rect(x + 4 + Math.sin(t * 2) * 1.5, y + 7, 4, 1, "rgba(160,220,255,.6)");
  },
  slick(x, y, t) {
    // the sprite is see-through here, so slick ice reads as floor and not as a block
    if (igReady() && IG_FRAMES.slick) { ctx.globalAlpha = 0.45; igSpr("slick", x + 8, y + 16); ctx.globalAlpha = 1; return; }
    rect(x, y, 16, 16, "#c6ecfb");
    line([[x + 2, y + 13], [x + 9, y + 3]], "rgba(255,255,255,.9)", 1.2);
    line([[x + 8, y + 14], [x + 14, y + 6]], "rgba(255,255,255,.6)", 1);
    const k = mod(t * 0.6 + (x + y) * 0.01, 1);
    if (k < 0.15) rect(x + 3 + k * 60, y + 4, 1.5, 1.5, "#ffffff");
  },
  crack(x, y, stage) {
    if (igSpr("crack" + stage, x + 8, y + 16)) return;
    const c = stage === 2 ? "#4b7d9c" : "#86b4cc", w = stage === 2 ? 1.3 : 0.9;
    line([[x + 3, y + 4], [x + 7, y + 8], [x + 6, y + 12], [x + 9, y + 14]], c, w);
    line([[x + 7, y + 8], [x + 12, y + 6], [x + 13, y + 3]], c, w);
    if (stage === 2) line([[x + 6, y + 12], [x + 2, y + 13]], c, w);
  },
  gold(x, y, t, shine) {
    if (!igSpr("gold", x + 8, y + 16)) {
      rounded(x + 0.5, y + 0.5, 15, 15, 2.5); ctx.fillStyle = "#8a6512"; ctx.fill();
      rounded(x + 1.5, y + 1.5, 13, 13, 2); ctx.fillStyle = "#f5c842"; ctx.fill();
      rect(x + 2.5, y + 2.5, 11, 4, "#ffe58a"); rect(x + 3, y + 3, 4, 1.5, "#ffffff");
      ctx.beginPath(); ctx.ellipse(x + 7.5, y + 9.5, 3.5, 2.2, 0, 0, TAU); ctx.fillStyle = "#e08a1e"; ctx.fill();   // the fish inside
      poly([[x + 10.5, y + 9.5], [x + 13, y + 7.5], [x + 13, y + 11.5]], "#e08a1e"); rect(x + 5, y + 8.8, 1, 1, "#3a2416");
    }
    const a = shine ? 0.6 : 0.25 + 0.2 * Math.sin(t * 4 + x);
    rect(x + 1, y + 1, 14, 14, `rgba(255,240,170,${Math.max(0, a) * 0.5})`);
  },
  pickPlanted(x, y) {
    if (igSpr("pick_planted", x + 8, y + 16)) return;
    ctx.beginPath(); ctx.ellipse(x + 8, y + 14, 4, 1.5, 0, 0, TAU); ctx.fillStyle = "rgba(60,110,140,.3)"; ctx.fill();
    rect(x + 7, y + 3, 2, 11, "#7a5230");
    poly([[x + 3, y + 3], [x + 13, y + 2], [x + 14, y + 4], [x + 4, y + 5]], "#9aa7b0");
    poly([[x + 9, y + 1], [x + 9, y + 6], [x + 14, y + 3.5]], "#e8354a");
  },
  item(it, x, y, t) {
    if (it.t < 3 && Math.floor(t * 8) % 2) return;               // blinks before it melts away
    const bob = Math.sin(t * 4 + x) * 1.2;
    ctx.beginPath(); ctx.ellipse(x + 8, y + 14, 5, 1.5, 0, 0, TAU); ctx.fillStyle = "rgba(60,110,140,.3)"; ctx.fill();
    if (igSpr("item_" + it.kind, x + 8, y + 16 + bob - 1)) return;
    const cx = x + 8, cy = y + 8 + bob;
    if (it.kind === "fish") {
      ctx.beginPath(); ctx.ellipse(cx - 1, cy, 5, 3, 0, 0, TAU); ctx.fillStyle = "#7fd4ff"; ctx.fill();
      poly([[cx + 3, cy], [cx + 7, cy - 3], [cx + 7, cy + 3]], "#7fd4ff"); rect(cx - 4, cy - 1, 1.2, 1.2, "#06202b");
      ctx.strokeStyle = "#2f7fa6"; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.ellipse(cx - 1, cy, 5, 3, 0, 0, TAU); ctx.stroke();
    } else if (it.kind === "snowballs") {
      for (const [dx, dy] of [[-3, 2], [3, 2], [0, -2]]) { ctx.beginPath(); ctx.arc(cx + dx, cy + dy, 2.8, 0, TAU); ctx.fillStyle = "#ffffff"; ctx.fill(); ctx.strokeStyle = "#7fa9bb"; ctx.lineWidth = 0.7; ctx.stroke(); }
    } else if (it.kind === "pick") {
      rect(cx - 0.8, cy - 5, 1.6, 11, "#7a5230");
      poly([[cx - 6, cy - 5], [cx + 6, cy - 6], [cx + 6, cy - 4], [cx - 5, cy - 3]], "#9aa7b0");
    } else {
      rounded(cx - 4, cy - 3, 7, 7, 1.5); ctx.fillStyle = "#c8743a"; ctx.fill();
      rect(cx - 3.5, cy - 3, 6, 1.5, "#5a3016");
      ctx.beginPath(); ctx.arc(cx + 3.5, cy + 0.5, 2, -1.2, 1.2); ctx.strokeStyle = "#c8743a"; ctx.lineWidth = 1.2; ctx.stroke();
      for (let k = 0; k < 2; k++) line([[cx - 2 + k * 3, cy - 5], [cx - 1 + k * 3, cy - 8 - Math.sin(t * 5 + k) * 0.8]], "rgba(255,255,255,.7)", 0.8);
    }
  },
  snowball(x, y) {
    if (igSpr("snowball", x, y + 4)) return;
    ctx.beginPath(); ctx.arc(x, y, 2.6, 0, TAU); ctx.fillStyle = "#ffffff"; ctx.fill(); ctx.strokeStyle = "#7fa9bb"; ctx.lineWidth = 0.7; ctx.stroke();
  },
  frozen(x, y, left) {
    if (igReady() && IG_FRAMES.frozen) { ctx.globalAlpha = Math.min(1, left) * 0.65; igSpr("frozen", x + 8, y + 16); ctx.globalAlpha = 1; return; }
    ctx.globalAlpha = Math.min(1, left) * 0.55;
    rounded(x + 0.5, y - 2, 15, 17, 3); ctx.fillStyle = "#a8e2f5"; ctx.fill();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1; ctx.stroke();
    ctx.globalAlpha = 1;
    line([[x + 3, y + 1], [x + 6, y - 1]], "rgba(255,255,255,.9)", 1);
  },
  // Northern lights over the field: fast-moving curtains of light green and violet that flash like a disco.
  aurora(t, k) {
    const x0 = IG.OX, y0 = IG.OY, S = IG.N * IG.CELL;
    ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, S, S); ctx.clip();
    const beat = 0.5 + 0.5 * Math.sin(t * 9);                       // the whole sky throbs with the beat
    rect(x0, y0, S, S, `rgba(${Math.sin(t * 4.5) > 0 ? "120,255,170" : "190,120,255"},${0.1 * beat * k})`);
    for (let i = 0; i < 9; i++) {
      const green = (i + Math.floor(t * 3)) % 2 === 0, pulse = 0.35 + 0.65 * Math.abs(Math.sin(t * 5 + i * 1.7));
      const cx = x0 + mod(i * 37 + t * (30 + i * 9) * (i % 2 ? 1 : -1), S + 60) - 30, w = 22 + 14 * Math.sin(t * 2.5 + i);
      const g = ctx.createLinearGradient(0, y0, 0, y0 + S);
      const col = green ? "110,255,165" : "185,110,255";
      g.addColorStop(0, `rgba(${col},${0.85 * pulse * k})`); g.addColorStop(0.5, `rgba(${col},${0.45 * pulse * k})`); g.addColorStop(1, `rgba(${col},${0.12 * pulse * k})`);
      ctx.fillStyle = g;
      const sw = Math.sin(t * 3 + i), sw2 = Math.sin(t * 2.4 + i * 2);
      ctx.beginPath();
      ctx.moveTo(cx - w / 2, y0);
      ctx.bezierCurveTo(cx - w / 2 + 18 * sw, y0 + S * 0.35, cx - w / 2 - 14 * sw2, y0 + S * 0.7, cx - w / 2 + 8 * sw, y0 + S);
      ctx.lineTo(cx + w / 2 + 8 * sw, y0 + S);
      ctx.bezierCurveTo(cx + w / 2 - 14 * sw2, y0 + S * 0.7, cx + w / 2 + 18 * sw, y0 + S * 0.35, cx + w / 2, y0);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  },
  // A snowstorm: the field greys over and snow streaks across it with the wind.
  storm(t, dir, k) {
    const x0 = IG.OX, y0 = IG.OY, S = IG.N * IG.CELL, [dr, dc] = IG_DIRS[dir];
    ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, S, S); ctx.clip();
    rect(x0, y0, S, S, `rgba(140,165,190,${0.36 * k})`);
    ctx.strokeStyle = `rgba(255,255,255,${0.9 * k})`; ctx.lineWidth = 1.4;
    for (let i = 0; i < 70; i++) {
      const u = mod(i * 0.137 + t * (0.9 + (i % 5) * 0.12), 1) * (S + 40) - 20, v = mod(i * 0.61803, 1) * S + Math.sin(t * 3 + i) * 3;
      const px = dc ? (dc > 0 ? x0 + u : x0 + S - u) : x0 + v, py = dr ? (dr > 0 ? y0 + u : y0 + S - u) : y0 + v;
      const len = 4 + (i % 4) * 2;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - dc * len, py - dr * len); ctx.stroke();
    }
    ctx.restore();
  },
  // The menu card's moving picture, drawn for a 146 x 106 card.
  preview(r, t) {
    const bx = r.x + 10, by = r.y + 8, bw = r.w - 20;
    rect(bx, by, bw, 96, "#f2faff");
    ctx.save(); ctx.beginPath(); ctx.rect(bx, by, bw, 96); ctx.clip();
    const ox = bx + 2, oy = by + 8;
    const ring = [[1, 1], [1, 2], [1, 3], [1, 4], [2, 1], [2, 4], [3, 1], [3, 2], [3, 4]];
    ring.forEach(([rr, cc], i) => {
      const x = ox + cc * 16, y = oy + rr * 16;
      if (i < 6) this.locked(x, y, true, null); else this.target(x, y, t, false);
    });
    const k = mod(t * 0.7, 1), sx = ox + 6 * 16 - k * 3 * 16;
    this.block(Math.max(ox + 4 * 16, sx), oy + 3 * 16, false);
    this.inuit(ox + 7 * 16 - Math.min(k, 0.1) * 30, oy + 3 * 16, "left", 0, false, false, 0);
    this.animal({ kind: "seal", dir: "right", walk: t, moving: true }, bx + mod(t * 18, bw + 20) - 16, oy + 67, t);
    ctx.restore();
  },
};

/* =========================================================================
   PLACEHOLDER GAME - stands in for all four games until they get real ones.
   It is deliberately small, and shows what a game needs from the shared shell:
   build() for each level, update(dt) and draw(), lives, score, levelDone() and finish(),
   saveData()/loadData() for the pause menu's Save, and the touch pads.
   The playing field is x 120-360, y 0-270; the side panels are for the HUD and the touch controls.
   ========================================================================= */
class Demo extends Game {
  constructor(id, title, color) {
    super(id, title);
    this.color = color; this.lives = 3; this.prefix = "";
    this.build(); this.ready();
  }
  get cfg() { return Object.assign({}, DEFAULTS.demo, this.levels[this.level]); }
  build() {
    const c = this.c = this.cfg;
    this.ship = { x: 240, y: 200, face: -Math.PI / 2, dead: false };
    this.shots = [];
    this.got = 0;
    this.orb = this.newOrb();
    this.mines = Array.from({ length: c.mines }, (_, i) => this.newMine(i));
  }
  newOrb() { return { x: rnd(136, 344), y: rnd(24, 150) }; }
  newMine(i) {
    const a = rnd(0, TAU);
    return { x: 140 + (i * 53) % 200, y: 20 + (i * 37) % 80, vx: Math.cos(a) * this.c.mineSpeed, vy: Math.sin(a) * this.c.mineSpeed, hp: 1 };
  }
  saveData() { return { got: this.got }; }
  loadData(d) { this.got = d.got || 0; }
  update(dt) {
    this.t += dt;
    this.runJobs(dt); this.updateFloats(dt);
    if (this.state === "name") { Input.touch = {}; this.updateName(); return; }
    Input.touch = Input.touchMode ? Pads.readStick() : {};
    for (const m of this.mines) {                       // the mines drift and bounce off the field's edges
      m.x += m.vx * dt; m.y += m.vy * dt;
      if (m.x < 126 || m.x > 354) { m.vx *= -1; m.x = clamp(m.x, 126, 354); }
      if (m.y < 6 || m.y > 264) { m.vy *= -1; m.y = clamp(m.y, 6, 264); }
    }
    if (this.state !== "play") return;
    const s = this.ship, sp = this.c.speed * dt, held = a => Input.held[a] || Input.touch[a];
    let dx = (held("right") ? 1 : 0) - (held("left") ? 1 : 0), dy = (held("down") ? 1 : 0) - (held("up") ? 1 : 0);
    if (Input.touch.dir !== undefined) { dx = Math.cos(Input.touch.dir); dy = Math.sin(Input.touch.dir); }
    if (dx || dy) { const n = Math.hypot(dx, dy); s.x += dx / n * sp; s.y += dy / n * sp; s.face = Math.atan2(dy, dx); }
    s.x = clamp(s.x, 128, 352); s.y = clamp(s.y, 8, 262);
    if (Input.just.a || (Input.touch.a && !this.fired)) {
      this.shots.push({ x: s.x, y: s.y, vx: Math.cos(s.face) * 260, vy: Math.sin(s.face) * 260 });
      Sound.play("mb_shoot");
    }
    this.fired = !!Input.touch.a;
    for (const b of this.shots) { b.x += b.vx * dt; b.y += b.vy * dt; }
    this.shots = this.shots.filter(b => b.x > 120 && b.x < 360 && b.y > 0 && b.y < 270 && !b.gone);
    for (const b of this.shots) for (const m of this.mines) if (!b.gone && Math.hypot(b.x - m.x, b.y - m.y) < 7) {
      b.gone = true; Object.assign(m, this.newMine(Math.floor(rnd(0, 9))));
      this.addScore(50); this.float("50", b.x, b.y, 0.8); Sound.play("mb_crash");
    }
    if (Math.hypot(s.x - this.orb.x, s.y - this.orb.y) < 10) {
      this.got++; this.addScore(100); this.float("100", this.orb.x, this.orb.y, 0.8); Sound.play("mb_pickup");
      if (this.got >= this.c.orbs) { this.state = "won"; Sound.play("tb_win"); this.levelDone("Level clear!", 2.2); return; }
      this.orb = this.newOrb();
    }
    if (this.mines.some(m => Math.hypot(s.x - m.x, s.y - m.y) < 9)) this.crash();
  }
  crash() {
    this.state = "lose"; this.ship.dead = true; this.lives--;
    Sound.play("mb_playerdie");
    if (this.lives <= 0) { this.msg = "Game over"; Sound.play("tb_lose"); this.after(2.5, () => this.finish()); return; }
    this.after(1.6, () => {
      this.ship = { x: 240, y: 200, face: -Math.PI / 2, dead: false };
      this.mines.forEach(m => { if (Math.hypot(m.x - 240, m.y - 200) < 60) m.y = 30; });
      this.ready();
    });
  }
  draw() {
    View.fill("#04141c");
    rect(120, 0, 240, 270, "#071f2b");
    for (let k = 0; k < 40; k++) rect(120 + mod(k * 61, 240), mod(k * 43 + this.t * (10 + k % 4 * 6), 270), 1, 1, "rgba(200,240,255,.5)");
    // the orb
    glow(this.orb.x, this.orb.y, 10, 10, "rgba(255,210,63,A)", 0.6 + 0.3 * Math.sin(this.t * 6));
    ctx.beginPath(); ctx.arc(this.orb.x, this.orb.y, 4, 0, TAU); ctx.fillStyle = "#ffd23f"; ctx.fill();
    // the mines
    for (const m of this.mines) {
      ctx.beginPath(); ctx.arc(m.x, m.y, 5, 0, TAU); ctx.fillStyle = "#ff4f6d"; ctx.fill();
      for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2 + this.t * 2; line([[m.x + Math.cos(a) * 5, m.y + Math.sin(a) * 5], [m.x + Math.cos(a) * 8, m.y + Math.sin(a) * 8]], "#ff9aa9", 1.5); }
    }
    for (const b of this.shots) rect(b.x - 1, b.y - 1, 2, 2, "#fff");
    // the craft
    const s = this.ship;
    if (!s.dead && this.state !== "name") this.drawCraft(s.x, s.y, s.face, this.color);
    this.drawFloats(16);
    const life = (x, y) => this.drawCraft(x + 6, y + 7, -Math.PI / 2, this.color, 0.7);
    life.w = 12;
    this.drawLeft("#8fd8ea", life);
    this.drawRight();
    if (this.dim) rect(120, 0, 240, 270, "rgba(2,14,20,.8)");
    this.drawMessage(135);
    if (this.state === "name") this.drawName();
  }
  drawCraft(x, y, a, color, k = 1) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(k, k);
    poly([[9, 0], [-6, -6], [-3, 0], [-6, 6]], color);
    rect(-5, -1, 3, 2, "#fff");
    ctx.restore();
  }
  drawRight() {
    if (View.portrait) { if (this.state !== "name" && Input.touchMode) Pads.drawStick(); return; }
    text(this.title, 421, 44, { size: 14, color: this.color });
    text("Placeholder game", 421, 62, { size: 10, color: "#9cc3d0" });
    text("Orbs " + this.got + " / " + this.c.orbs, 421, 90, { size: 12, color: "#ffd23f" });
    if (!Input.touchMode) {
      text("Arrows  fly", 421, 227, { size: 11, color: "#6f97a6" });
      text("Space  fire", 421, 240, { size: 11, color: "#6f97a6" });
    } else if (this.state !== "name") Pads.drawStick();
  }
}
